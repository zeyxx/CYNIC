[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-workload"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sovereign agent workload lifecycle: admission, claims, delivery, durability, settlement, and workspace reconciliation for CYNIC"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-consensus = { path = "../cynic-consensus" }
cynic-finance = { path = "../cynic-finance" }
cynic-pool = { path = "../cynic-pool" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
hex.workspace = true
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
