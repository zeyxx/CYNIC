[package]
name = "cynic-cli"
version.workspace = true
edition.workspace = true
publish = false
default-run = "cynic"

[[bin]]
name = "cynic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cynic-host = { path = "../cynic-host" }
cynic-inference = { path = "../cynic-inference" }
cynic-node = { path = "../cynic-node" }
cynic-protocol = { path = "../cynic-protocol" }
cynic-workload = { path = "../cynic-workload" }
cynic-storage = { path = "../cynic-storage" }
cynic-vcs = { path = "../cynic-vcs" }
cynic-build = { path = "../cynic-build" }
cynic-lifecycle = { path = "../cynic-lifecycle" }
cynic-forensics = { path = "../cynic-forensics" }
cynic-release = { path = "../cynic-release" }
tokio = { version = "1", features = ["full"] }
ratatui = { version = "0.29", default-features = true }
crossterm = "0.28"
chrono = "0.4"
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# node_activation_surface hashes an identity public key for its report digest.
# Versions match cynic-node / cynic-protocol so the CLI does not pull a second
# copy of sha2 into the graph.
sha2 = "0.10.8"
hex = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
rustix = { version = "1", features = ["fs"] }
serde_json = "1"

[lints]
workspace = true
