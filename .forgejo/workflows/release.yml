name: CYNIC Release (sovereign runner)

# The release path is the one the contracts declare, not an invented one.
#
# `contracts/release-gates.json`:
#   "All mandatory gates must pass before a release tag is created on
#    forgejo/main."
#   Mandatory gates: cargo check, tests, secret lint, architecture boundary.
#
# `contracts/relay-policy.json`:
#   topology.automation_topology.target_pipeline.runner:
#     "10.10.10.119 (cynic-builder)"
#   trigger: "forgejo push webhook on main or release tag"
#   action.read_back: "verify github/ref matches forgejo/ref after push"
#
# So the release runs on the sovereign builder runner (`cynic/build`), the
# four mandatory gates run first, the tag is created on Forgejo — the
# sovereign source — and the public projection is verified by reading the
# GitHub ref back and comparing it to the Forgejo ref.
#
# The runner is the build SSOT. Nothing here builds on an operator host.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and verify (e.g. v0.8.1)"
        required: true

env:
  CARGO_TERM_COLOR: always
  CYNIC_ALLOW_LOCAL_DEV_BUILD: "1"
  RUSTFLAGS: "-C debuginfo=0"
  RUST_MIN_STACK: "8589934592"

jobs:
  release:
    name: Release Gate, Build and Relay
    runs-on: [cynic/build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      # ── Mandatory gate 1/4: cargo check ───────────────────────────────
      - name: "Mandatory gate: cargo_check"
        id: gate_cargo_check
        run: |
          set -eu
          cargo check --workspace --locked

      # ── Mandatory gate 2/4: tests ─────────────────────────────────────
      # The full workspace suite, not the four suites the CI workflow runs.
      # The CI workflow covers cynic-types, cynic-knowledge, cynic-inference
      # and one coherence test; the crates that carry the build, workload,
      # node and audit surfaces are exercised only here. A release gate that
      # tests less than the suite it certifies certifies nothing.
      - name: "Mandatory gate: tests"
        id: gate_tests
        run: |
          set -eu
          cargo test --workspace --locked

      # ── Mandatory gate 3/4: secret lint ───────────────────────────────
      - name: "Mandatory gate: secret_lint"
        id: gate_secret_lint
        run: |
          set -eu
          cargo run -q -p cynic-cli -- audit secret --json

      # ── Mandatory gate 4/4: architecture boundary ─────────────────────
      - name: "Mandatory gate: architecture_boundary"
        id: gate_architecture
        run: |
          set -eu
          cargo run -q -p cynic-cli -- audit crate --json

      - name: "Release gate receipt"
        if: always()
        env:
          CARGO_CHECK_OUTCOME: ${{ steps.gate_cargo_check.outcome }}
          TESTS_OUTCOME: ${{ steps.gate_tests.outcome }}
          SECRET_LINT_OUTCOME: ${{ steps.gate_secret_lint.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.gate_architecture.outcome }}
        run: |
          set -u
          failed=0
          for entry in "cargo_check:${CARGO_CHECK_OUTCOME}" \
                       "tests:${TESTS_OUTCOME}" \
                       "secret_lint:${SECRET_LINT_OUTCOME}" \
                       "architecture_boundary:${ARCHITECTURE_OUTCOME}"; do
            gate="${entry%%:*}"
            outcome="${entry#*:}"
            printf '  %-24s %s\n' "${gate}" "${outcome}"
            if [ "${outcome}" != "success" ]; then failed=1; fi
          done

          if [ "${failed}" -eq 1 ]; then
            verdict="FAIL"
            echo "::error::Release gate: FAIL — a mandatory gate did not succeed. No tag, no build, no relay."
          else
            verdict="PASS"
            echo "Release gate: PASS — every mandatory gate succeeded."
          fi

          printf '{"gate":"release-mandatory","verdict":"%s","sha":"%s","tag":"%s","run_id":"%s","ts":"%s","gates":{"cargo_check":"%s","tests":"%s","secret_lint":"%s","architecture_boundary":"%s"}}\n' \
            "${verdict}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${GITHUB_RUN_ID}" "$(date -u +%FT%TZ)" \
            "${CARGO_CHECK_OUTCOME}" "${TESTS_OUTCOME}" "${SECRET_LINT_OUTCOME}" "${ARCHITECTURE_OUTCOME}" \
            > release-gate-receipt.json
          cat release-gate-receipt.json

          if [ "${verdict}" != "PASS" ]; then
            exit 1
          fi

      - name: Upload Release Gate Receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-receipt-${{ github.run_id }}
          path: release-gate-receipt.json
          retention-days: 90

      # ── Build the release binaries ────────────────────────────────────
      # The binary set is declared in infra/release-binaries.json, the same
      # registry the deploy executor reads. The set is read, not restated:
      # a literal list here would be a second authority for what a release
      # ships.
      #
      # The registry names the crate of every binary, so the build command
      # is derived from it too — no `--bin` and no `-p` is written here.
      # A registry entry that names a crate cannot drift from the crate
      # that is actually built.
      - name: "Read the declared release binary set"
        id: release_binaries
        run: |
          set -eu
          names="$(python3 -c "
          import json
          with open('infra/release-binaries.json') as handle:
              registry = json.load(handle)
          deployable = [
              entry['name']
              for entry in registry['binaries']
              if entry.get('deploy', True)
          ]
          if not deployable:
              raise SystemExit('the deployable set is empty')
          print(' '.join(deployable))
          ")"
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "release binaries: ${names}"

      - name: "Derive the build command from the registry"
        id: build_command
        run: |
          set -eu
          read -r packages bins <<< "$(python3 -c "
          import json
          with open('infra/release-binaries.json') as handle:
              registry = json.load(handle)
          deployable = [
              entry
              for entry in registry['binaries']
              if entry.get('deploy', True)
          ]
          if not deployable:
              raise SystemExit('the deployable set is empty')
          packages = ' '.join(sorted({entry['crate'] for entry in deployable}))
          bins = ' '.join('--bin ' + entry['name'] for entry in deployable)
          print(packages, bins)
          ")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "bins=${bins}" >> "$GITHUB_OUTPUT"
          echo "cargo build -p ${packages} ${bins}"

      - name: Build release binaries
        run: |
          set -eu
          cargo build --release --locked \
            -p ${{ steps.build_command.outputs.packages }} \
            ${{ steps.build_command.outputs.bins }}

      - name: Package release binaries
        id: package
        run: |
          set -eu
          mkdir -p dist
          for name in ${{ steps.release_binaries.outputs.names }}; do
            cp "target/release/${name}" "dist/${name}"
          done

      # `contracts/release-versioning.json`:
      #   "A distribution.yaml manifest accompanies each release with name,
      #    version, description, and environment requirements."
      #   fields: name, version, description, hermes_requires, env_requires
      #
      # The manifest is machine-readable release metadata for downstream
      # consumers, so it is generated from the same authorities the release
      # uses: the version comes from Cargo.toml, the binary set from the
      # registry. Writing it by hand would be a third place where the
      # version lives.
      - name: "Generate the distribution manifest"
        id: distribution
        run: |
          set -eu
          python3 - <<'PY' > dist/distribution.yaml
          import json
          import re

          with open('Cargo.toml', encoding='utf-8') as handle:
              cargo = handle.read()
          workspace = cargo.split('[workspace.package]', 1)[1]
          version = re.search(r'^version\s*=\s*"([^"]+)"', workspace, re.M).group(1)

          with open('infra/release-binaries.json', encoding='utf-8') as handle:
              registry = json.load(handle)
          deployable = [
              entry for entry in registry['binaries'] if entry.get('deploy', True)
          ]

          def quoted(value):
              return '"' + str(value).replace('\\', '\\\\').replace('"', '\\"') + '"'

          print('name: "cynic"')
          print('version: ' + quoted(version))
          print('description: "CYNIC — a sovereign, low-layer runtime for multi-agent systems."')
          print('hermes_requires: ">=0.1.0"')
          print('env_requires:')
          print('  RUST_LOG: "optional; default info"')
          print('  CYNIC_HOME: "optional; default ~/.local/share/cynic"')
          print('binaries:')
          for entry in deployable:
              print('  - name: ' + quoted(entry['name']))
              print('    crate: ' + quoted(entry['crate']))
              print('    role: ' + quoted(entry['role']))
          PY
          cat dist/distribution.yaml

      # The checksums cover every artefact that ships, the manifest
      # included — the manifest is the file a downstream consumer reads
      # first, so it is the one whose integrity matters most.
      - name: "Checksum every release artefact"
        run: |
          set -eu
          ( cd dist && sha256sum * > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: cynic-release-${{ github.run_id }}
          path: dist/
          retention-days: 90

      # ── Relay read_back: the public projection must match the source ──
      # `contracts/relay-policy.json` states the read_back explicitly:
      # "verify github/ref matches forgejo/ref after push". The comparison
      # is the proof; the push alone is not.
      - name: "Relay read_back: the public projection matches the sovereign source"
        if: always()
        run: |
          set -u
          remote="$(git remote get-url github 2>/dev/null || true)"
          if [ -z "${remote}" ]; then
            echo "::error::Relay read_back: no github remote is configured on this checkout."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          forgejo_sha="$(git rev-parse "${tag}^{commit}" 2>/dev/null || git rev-parse HEAD)"
          github_sha="$(git ls-remote github "refs/tags/${tag}" 2>/dev/null | awk '{print $1}' | head -1)"
          if [ -z "${github_sha}" ]; then
            github_sha="$(git ls-remote github refs/heads/main 2>/dev/null | awk '{print $1}' | head -1)"
            forgejo_sha="$(git ls-remote origin refs/heads/main 2>/dev/null | awk '{print $1}' | head -1)"
          fi

          printf '  forgejo ref: %s\n  github  ref: %s\n' "${forgejo_sha}" "${github_sha}"

          if [ -z "${forgejo_sha}" ] || [ -z "${github_sha}" ]; then
            echo "::error::Relay read_back: a ref could not be read back."
            exit 1
          fi
          if [ "${forgejo_sha}" != "${github_sha}" ]; then
            echo "::error::Relay read_back: the public projection does not match the sovereign source."
            exit 1
          fi
          echo "Relay read_back: PASS — github ref matches forgejo ref."

      - name: "Echo release artefacts"
        if: always()
        run: |
          set -u
          if [ -f release-gate-receipt.json ]; then
            echo "RELEASE_RECEIPT_BEGIN"
            cat release-gate-receipt.json
            echo "RELEASE_RECEIPT_END"
          else
            echo "release-gate-receipt.json missing"
          fi
          if [ -f dist/SHA256SUMS ]; then
            echo "SHA256SUMS_BEGIN"
            cat dist/SHA256SUMS
            echo "SHA256SUMS_END"
          fi
