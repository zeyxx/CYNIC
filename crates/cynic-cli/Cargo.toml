[package]
name = "cynic-cli"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cynic"

[[bin]]
name = "cynic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cynic-host = { path = "../cynic-host" }
cynic-inference = { path = "../cynic-inference" }
cynic-node = { path = "../cynic-node" }
cynic-protocol = { path = "../cynic-protocol" }
tokio = { version = "1", features = ["full"] }
# Interactive chat TUI (codex / hermes / grok-build class UX)
ratatui = { version = "0.29", default-features = true }
crossterm = "0.28"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
