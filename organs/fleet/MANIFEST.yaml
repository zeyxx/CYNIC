name: organ-fleet
domain: fleet
domain_role: runtime_truth_aggregator
role: fleet_truth_aggregator
description: "Aggregates declared registry state and runtime provider evidence into one fleet truth surface for cortex and operator attention."
version: 0.1.0
status: planned
owner: organ-fleet
dependencies:
  - cynic-kernel
inputs:
  registry:
    - infra/registry.json
  providers:
    - proxmox
    - proxmox_mcp_text
    - headscale
    - synapse
    - systemd
    - kernel_health
outputs:
  report:
    format: json
    fields:
      - desired
      - declared
      - observed
      - effective
      - anomalies
      - energy
  lxc_exec_bridge_policy:
    format: json
    path: organs/fleet/policies/lxc-exec-bridge.policy.json
rules:
  - active_requires_recent_runtime_proof
  - headscale_is_access_mesh
  - wireguard_is_synapse_mesh
  - powered_off_can_be_intentional_energy_state
  - lxc_exec_requires_root_owned_bridge_not_raw_pct
commands:
  report_json:
    - python3 organs/fleet/src/entrypoints/cli.py report --json --registry infra/registry.json
  lxc_exec_bridge_validate:
    - python3 organs/fleet/src/entrypoints/cli.py lxc-exec-bridge validate-policy --json
  lxc_exec_bridge_helper_dry_run:
    - echo '{"node":"pve","vmid":103,"purpose":"read_only","argv":["hostname"],"agent_id":"cortex-test"}' | python3 organs/fleet/src/entrypoints/lxc_exec_bridge_helper.py --dry-run
  lxc_exec_bridge_install_plan:
    - python3 organs/fleet/src/entrypoints/cli.py lxc-exec-bridge install-plan
components:
  - name: src/adapters/fleet_cli_runtime.py
    description: Runtime adapter for building fleet truth reports from registry and provider evidence
    integration_status: transition_debt
    owner: organ-fleet
    expiry_condition: Fleet report CLI remains a thin parser/output membrane
  - name: src/adapters/lxc_exec_bridge_helper_runtime.py
    description: Runtime adapter for root-owned LXC exec bridge policy loading, request validation, and pct argv execution
    integration_status: transition_debt
    owner: organ-fleet
    expiry_condition: LXC exec bridge entrypoint remains a thin JSON/stdin CLI membrane
state_paths:
  - state/fleet-truth.json
