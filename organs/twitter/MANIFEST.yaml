id: organ-twitter
tier: 2
domain: social
domain_role: primary
status: ACTIVE
framework: hexagonal-organ
systemd_executor: organ-twitter-hermes-agent.service
systemd_dispatch: organ-twitter-cron.service

description: |
  Twitter/X organ — perception/transformation/analysis/learning cycle
  for X/Twitter data. It exposes a cortex-readable context bridge:
  manually supplied tweets/articles/notes are normalized into JSONL and
  exported as Markdown/JSON bundles under organs/twitter/state/context/.
  Managed by Hermes-Agent executor + 30min dispatch.
  Hermes X runtime code is owned by this organ under src/core, src/adapters and
  src/entrypoints. The root-level legacy scripts/hermes-x copy has been removed; organ-twitter
  src/entrypoints is the runtime source of truth.

inputs:
  - source: kernel /observations
    data: recent observations across all domains
  - source: ~/.cynic/organs/twitter/dataset.jsonl
    data: raw tweets from x_ingest_daemon
  - source: organs/twitter/state/context_items.jsonl
    data: operator-supplied tweets, threads, articles, and notes for cortex context
  - source: kernel /verdicts
    data: verdict history for feedback analysis

outputs:
  - path: organs/twitter/state/context/latest.md
    format: markdown
    frequency: on-demand via cli.py bundle
  - path: organs/twitter/state/context/latest.json
    format: json
    frequency: on-demand via cli.py bundle
  - path: ~/.cynic/organs/twitter/reflections/
    format: json
    frequency: hourly
  - path: kernel /observe (domain=twitter)
    format: REST POST
    frequency: per-cycle
  - path: ~/.cynic/organs/hermes/x/domain_signals/
    format: json
    frequency: every 30min via hermes-curation
  - path: ~/.cynic/organs/hermes/x/SKILL.md
    format: markdown
    frequency: every 1h/4h via feedback and briefing consumers
  - path: kernel /agent-tasks
    format: REST POST
    frequency: every 10min via K15 consumer

crons:
  - organ-twitter-cron.timer
  - hermes-ingest.service
  - hermes-curation.service
  - hermes-search-generator.service
  - hermes-feedback-loop.service
  - hermes-k15-consumer.service
  - hermes-gemini-briefing.service

scripts:
  - name: src/dispatch.py
    description: Hexagonal architecture entrypoint
  - name: src/entrypoints/cli.py
    description: Ingest tweets/articles/notes, inspect state, and export cortex context bundles
    integration_status: organ_entrypoint
    owner: organ-twitter
    expiry_condition: none
  - name: src/adapters/twitter_cli_runtime.py
    description: Runtime handlers for organ-twitter context ingestion, listing, bundling, perception and diagnostics
    integration_status: transition_debt
    owner: organ-twitter
    expiry_condition: organ-twitter CLI entrypoint remains a thin parser and dispatch membrane
  - name: src/core/convergence_detector.py
    description: Organ-owned X signal convergence detector; root-level legacy copy has been removed
    integration_status: transition_debt
    owner: organ-twitter
    expiry_condition: track organ-twitter Hermes X migration files or quarantine them
  - name: src/core/ingest_signals.py
    description: Pure X ingest domain assignment and Dog stimulus formatting rules
    integration_status: transition_debt
    owner: organ-twitter
    expiry_condition: track organ-twitter Hermes X migration files or quarantine them
  - name: src/core/domain_curation.py
