[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-zeroclaw-solana"
version.workspace = true
edition.workspace = true
description = "Sovereign Solana-native plugin and threat firewall for ZeroClaw agents"
publish = false

[dependencies]
cynic-intel = { path = "../cynic-intel" }
cynic-protocol = { path = "../cynic-protocol" }
cynic-solana-pay = { path = "../cynic-solana-pay" }
qrcodegen = "1.8"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[[example]]
name = "zeroclaw-solana-demo"
path = "examples/demo.rs"

[lints]
workspace = true
