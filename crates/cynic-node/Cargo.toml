[package]
name = "cynic-node"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cynic-node"

[[bin]]
name = "cynic-node"
path = "src/main.rs"

[[bin]]
name = "cynic-network-actuator"
path = "src/actuator_main.rs"

[dependencies]
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "process", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
http = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
process-wrap = { version = "9.1", features = ["tokio1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
chrono = "0.4"
sysinfo = "0.33"
tempfile = "3"
sha2 = "0.10.8"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
zeroize = "1"
cynic-protocol = { path = "../cynic-protocol" }
cynic-host = { path = "../cynic-host" }
cynic-inference = { path = "../cynic-inference" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }


[dev-dependencies]
axum = "0.8"

[lints]
workspace = true
