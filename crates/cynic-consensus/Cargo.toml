[package]
name = "cynic-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fleet consensus, temporal monotonic synchronization, and DeploymentEpoch sequencer for CYNIC"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2.2"

[dev-dependencies]
tempfile = "3.17"
