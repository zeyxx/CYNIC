name: CYNIC F-Gate (Forgejo)

on:
  push:
    branches: [main, "sync/*", "agent/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CYNIC_ALLOW_LOCAL_DEV_BUILD: "1"
  RUSTFLAGS: "-C debuginfo=0"
  POOL_LABEL: cynic/build

jobs:
  # Every suite is its own job so the pool can spread them across the
  # sovereign runners. A single monolithic job would pin the whole gate to
  # one runner and serialize the workspace compilation.
  pool_eligibility:
    name: Gate 0 Pool Eligibility
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"
          rustc --version
          cargo --version

      - name: Build the sovereign CLI
        run: cargo build --release -p cynic-cli

      - name: Verify pool eligibility for this label
        run: |
          set -eu
          # The CYNIC binary is the authority: it reads the registry, resolves
          # the label to the base-enrolled grantors, and probes the local
          # toolchain. No reimplementation of that logic in the workflow.
          "$CARGO_TARGET_DIR/release/cynic" build pool eligibility \
            --label "$POOL_LABEL" \
            --registry infra/registry.json \
            --observed-labels "$POOL_LABEL"

  validate_json:
    name: Gate 1 Contract Validation
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Foundation & Infra JSON Contracts
        run: |
          set -eu
          for file in \
            contracts/foundation.json \
            infra/runtime-authority.json \
            infra/registry.json \
            infra/agent-exposure.json \
            infra/ecosystem-pins.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"
            echo "OK $file"
          done

  check_compile:
    name: Gate 2 Workspace Compilation
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"

      - name: Check Workspace Compilation
        run: cargo check --workspace

  test_core_types:
    name: Gate 3 Core Types
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"

      - name: Run Core Types Test Suite
        run: cargo test -p cynic-types

  test_knowledge:
    name: Gate 3 Knowledge
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"

      - name: Run Knowledge Test Suite
        run: cargo test -p cynic-knowledge

  test_inference:
    name: Gate 3 Inference
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"

      - name: Run Inference Test Suite
        run: cargo test -p cynic-inference

  test_canonical_paths:
    name: Gate 3 Canonical Paths
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"

      - name: Run Canonical Paths Coherence Test
        run: cargo test -p cynic-cli --test canonical_paths_coherence

  verdict:
    name: Layer 0-4 Verification Gate
    needs:
      - pool_eligibility
      - validate_json
      - check_compile
      - test_core_types
      - test_knowledge
      - test_inference
      - test_canonical_paths
    runs-on: [cynic/build]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggregate Test Suite Verdict
        env:
          POOL_ELIGIBILITY_OUTCOME: ${{ needs.pool_eligibility.result }}
          JSON_VALIDATION_OUTCOME: ${{ needs.validate_json.result }}
          COMPILE_OUTCOME: ${{ needs.check_compile.result }}
          CORE_TYPES_OUTCOME: ${{ needs.test_core_types.result }}
          KNOWLEDGE_OUTCOME: ${{ needs.test_knowledge.result }}
          INFERENCE_OUTCOME: ${{ needs.test_inference.result }}
          CANONICAL_PATHS_OUTCOME: ${{ needs.test_canonical_paths.result }}
        run: |
          set -u

          hard_gate_failed=0
          for entry in "pool_eligibility:${POOL_ELIGIBILITY_OUTCOME}" \
                       "validate_json:${JSON_VALIDATION_OUTCOME}" \
                       "check_compile:${COMPILE_OUTCOME}"; do
            gate="${entry%%:*}"
            outcome="${entry#*:}"
            if [ "${outcome}" != "success" ]; then
              hard_gate_failed=1
              printf '  %-18s %s (hard gate)\n' "${gate}" "${outcome}"
            else
              printf '  %-18s %s\n' "${gate}" "${outcome}"
            fi
          done

          failed_suites=""
          skipped_suites=""
          for suite in core_types knowledge inference canonical_paths; do
            var="$(printf '%s_OUTCOME' "${suite}" | tr '[:lower:]' '[:upper:]')"
            outcome="${!var}"
            printf '  %-18s %s\n' "${suite}" "${outcome}"
            case "${outcome}" in
              failure|timed_out) failed_suites="${failed_suites} ${suite}" ;;
              skipped) skipped_suites="${skipped_suites} ${suite}" ;;
            esac
          done

          if [ "${hard_gate_failed}" -eq 1 ]; then
            echo "::error::Aggregate verdict: FAIL — a hard gate did not succeed, so the suites did not all execute."
          fi
          if [ -n "${failed_suites}" ]; then
            echo "::error::Aggregate verdict: FAIL — failing suites:${failed_suites}"
          fi
          if [ -n "${skipped_suites}" ] && [ "${hard_gate_failed}" -eq 0 ]; then
            echo "::warning::Aggregate verdict: suites skipped without a broken hard gate:${skipped_suites}"
          fi

          if [ "${hard_gate_failed}" -eq 1 ] || [ -n "${failed_suites}" ]; then
            echo "Aggregate verdict: FAIL"
            verdict="FAIL"
          else
            echo "Aggregate verdict: PASS — every executed test suite succeeded."
            verdict="PASS"
          fi

          printf '{"gate":"layer-0-4","verdict":"%s","sha":"%s","run_id":"%s","ts":"%s","gates":{"pool_eligibility":"%s","validate_json":"%s","check_compile":"%s","core_types":"%s","knowledge":"%s","inference":"%s","canonical_paths":"%s"}}\n' \
            "${verdict}" "${GITHUB_SHA:-unknown}" "${GITHUB_RUN_ID:-local}" "$(date -u +%FT%TZ)" \
            "${POOL_ELIGIBILITY_OUTCOME}" "${JSON_VALIDATION_OUTCOME}" "${COMPILE_OUTCOME}" "${CORE_TYPES_OUTCOME}" \
            "${KNOWLEDGE_OUTCOME}" "${INFERENCE_OUTCOME}" "${CANONICAL_PATHS_OUTCOME}" \
            > gate-receipt.json
          cat gate-receipt.json

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## F-gate receipt"
              echo '```json'
              cat gate-receipt.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

          if [ "${verdict}" = "FAIL" ]; then
            exit 1
          fi

      # The gate receipt is written into the workspace: it is the durable
      # evidence. Artifact upload is skipped on purpose: Forgejo 11.0.1 does
      # not support upload-artifact@v4, and a red step that nobody reads is
      # noise, not proof.

      - name: Echo Gate Receipt (fallback)
        if: always()
        run: |
          if [ -f gate-receipt.json ]; then
            echo "GATE_RECEIPT_BEGIN"
            cat gate-receipt.json
            echo "GATE_RECEIPT_END"
          else
            echo "gate-receipt.json missing"
          fi
