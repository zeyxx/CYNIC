[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-host"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "cynic-host-exec"
path = "src/bin/cynic-host-exec.rs"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }
cynic-node-protocol = { path = "../cynic-node-protocol" }
cynic-workload = { path = "../cynic-workload" }
cynic-inference = { path = "../cynic-inference" }
cynic-vcs = { path = "../cynic-vcs" }
cynic-eval = { path = "../cynic-eval" }
cynic-vcs-forgejo = { path = "../cynic-vcs-forgejo" }
cynic-storage = { path = "../cynic-storage" }
cynic-build = { path = "../cynic-build" }
cynic-sandbox = { path = "../cynic-sandbox" }
cynic-lifecycle = { path = "../cynic-lifecycle" }
cynic-network = { path = "../cynic-network" }
cynic-forensics = { path = "../cynic-forensics" }
cynic-release = { path = "../cynic-release" }
cynic-lxc = { path = "../cynic-lxc" }
cynic-pkg = { path = "../cynic-pkg" }
cynic-intel = { path = "../cynic-intel" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-finance = { path = "../cynic-finance" }
# The lease store persists DateTime<Utc> lease deadlines to disk, so chrono's
# serde impls are required. cynic-kernel already declares it this way; cynic-host
# did not, because no compiled module had ever needed it.
chrono.workspace = true
libc = "0.2"
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
tokio.workspace = true
async-trait.workspace = true
sysinfo = "0.39.6"
zeroize.workspace = true
ed25519-dalek.workspace = true
regex = "1"
walkdir.workspace = true
thiserror.workspace = true
rand = "0.8"
rpassword = "7.5.4"

[dev-dependencies]
# The workspace-wide audit gates that also need the coordination lease store.
# A dev-dependency, not a production edge: cynic-host the library must not
# depend on its own auditor.
cynic-audit-engine = { path = "../cynic-audit-engine" }
tempfile = "3"
# adversarial_red_team_suite and multi_agent_e2e_simulation both import
# cynic_intel::{escore, futarchy}. The crate exists and exports them; it was
# simply never declared as a dependency, so neither suite could compile.

