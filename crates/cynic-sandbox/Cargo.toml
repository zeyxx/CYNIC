[package]
name = "cynic-sandbox"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Sovereign Collective"]
description = "Deterministic execution sandboxing and confinement domain for CYNIC"
license = "MIT OR Apache-2.0"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
