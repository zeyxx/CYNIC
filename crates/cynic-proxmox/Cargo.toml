[package]
name = "cynic-proxmox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
walkdir.workspace = true
futures.workspace = true
tokio.workspace = true

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }
cynic-process = { path = "../cynic-process" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-host = { path = "../cynic-host" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex.workspace = true
thiserror.workspace = true
toml.workspace = true
# `rustls` is required, not optional: proxmox_control calls
# reqwest::Certificate::from_pem and add_root_certificate, both gated behind
# the TLS feature. cynic-host compiles only because another crate in ITS graph
# enables TLS (feature unification); compiled alone, cynic-proxmox must ask
# for it explicitly.
reqwest = { workspace = true, features = ["rustls"] }
ed25519-dalek.workspace = true

[lints]
workspace = true
