# CYNIC Synapse Mesh DNS configuration
# Zone: synapse.cynic (10.10.10.0/24 on vmbr0)
# Source of truth: infra/registry.json (network_policy.reservations)
# Deployed to: Proxmox PVE (/etc/dnsmasq.d/synapse.conf)

domain=synapse.cynic
local=/synapse.cynic/

# === Hypervisor ===
address=/cynic-host-proxmox.synapse.cynic/10.10.10.1
address=/pve.synapse.cynic/10.10.10.1
address=/pve/10.10.10.1

# === Source SSOT (Forgejo) ===
address=/forgejo.synapse.cynic/10.10.10.101
address=/organ-forgejo.synapse.cynic/10.10.10.101
address=/cynic-lxc-git.synapse.cynic/10.10.10.101
address=/forgejo/10.10.10.101

# === Storage (SurrealDB) ===
address=/cynic-lxc-surrealdb.synapse.cynic/10.10.10.103
address=/cynic-storage-primary.synapse.cynic/10.10.10.103
address=/organ-surrealdb.synapse.cynic/10.10.10.103
address=/surrealdb/10.10.10.103

# === Builder ===
address=/cynic-builder.synapse.cynic/10.10.10.119
address=/cynic-builder/10.10.10.119

# === Agent Host ===
address=/cynic-agent-host.synapse.cynic/10.10.10.102
address=/cynic-agent-host/10.10.10.102

# === Kernel Primary (Cortex) ===
address=/cynic-kernel-primary.synapse.cynic/10.10.10.100
address=/kernel.synapse.cynic/10.10.10.100
address=/local-kernel.synapse.cynic/10.10.10.100
address=/organ-kernel.synapse.cynic/10.10.10.100

# === Headscale (Coordination) ===
address=/cynic-lxc-headscale.synapse.cynic/10.10.10.40
address=/headscale.synapse.cynic/10.10.10.40
address=/organ-headscale.synapse.cynic/10.10.10.40
