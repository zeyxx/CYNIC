name: CYNIC F-Gate (Forgejo)

on:
  push:
    branches: [main, "sync/*", "agent/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CYNIC_ALLOW_LOCAL_DEV_BUILD: "1"
  RUSTFLAGS: "-C debuginfo=0"
  POOL_LABEL: cynic/build

jobs:
  # Every suite is its own job so the pool can spread them across the
  # sovereign runners. A single monolithic job would pin the whole gate to
  # one runner and serialize the workspace compilation.
  pool_eligibility:
    name: Gate 0 Pool Eligibility
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Persistent, shared build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). A job starts warm instead
          # of recompiling the workspace from scratch: measured on
          # builder-119, 256s cold vs 96s warm.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          target_dir="${state_root}/build-targets/fgate"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"
          # Compilation parallelism, decided by the CYNIC binary from the
          # observed memory and published by Gate 0 in the shared target
          # directory. A missing or unreadable file means the decision was
          # not taken: the safe answer is ONE compilation at a time, never
          # the machine's core count.
          if [ -r "$target_dir/gate-jobs" ]; then
            jobs=$(cat "$target_dir/gate-jobs")
          else
            jobs=1
          fi
          case "$jobs" in
            ''|*[!0-9]*) jobs=1 ;;
          esac
          [ "$jobs" -ge 1 ] 2>/dev/null || jobs=1
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "compilation parallelism: $jobs"
          rustc --version
          cargo --version


      - name: Publish the compilation parallelism this runner can hold
        run: |
          set -eu
          # The gate is sharded into several jobs that share ONE build target
          # directory, and the shard count is a function of the machine, not a
          # constant. When two shards compile the same dependency tree at the
          # same time, the kernel OOM-kills one of them and the CI reports the
          # kill as a test failure: measured on builder-119 (8 GiB, 4 cores),
          # a single rustc peaks at ~396 MiB, two concurrent compilations of
          # cynic-cli crossed the physical RAM, and the failing job MOVED
          # between two runs on a byte-identical tree.
          #
          # The CYNIC binary decides, from the observed memory, how many
          # concurrent compilations fit. The decision is published in the
          # shared target directory, which is where the shared build cache
          # already lives, so the other shards read it.
          if [ -x "$CARGO_TARGET_DIR/release/cynic" ]; then
            "$CARGO_TARGET_DIR/release/cynic" build pool memory --json > "$target_dir/gate-jobs.json"
            jobs=$(python3 -c "import json;print(json.load(open('$target_dir/gate-jobs.json'))['jobs'])")
            echo "$jobs" > "$target_dir/gate-jobs"
            echo "published compilation parallelism: $jobs"
          else
            echo "no published decision yet: the first run compiles serially"
          fi

      - name: Build the sovereign CLI
        run: cargo build --release -p cynic-cli

      - name: Verify pool eligibility for this label
        run: |
          set -eu
          # The CYNIC binary is the authority: it reads the registry, resolves
          # the label to the base-enrolled grantors, and probes the local
          # toolchain. No reimplementation of that logic in the workflow.
          "$CARGO_TARGET_DIR/release/cynic" build pool eligibility \
            --label "$POOL_LABEL" \
            --registry infra/registry.json \
            --observed-labels "$POOL_LABEL"

  validate_json:
    name: Gate 1 Contract Validation
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Foundation & Infra JSON Contracts
        run: |
          set -eu
          for file in \
            contracts/foundation.json \
            infra/runtime-authority.json \
            infra/registry.json \
            infra/agent-exposure.json \
            infra/ecosystem-pins.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"
            echo "OK $file"
          done

  check_compile:
    name: Gate 2 Workspace Compilation
    # Gate 0 publishes the compilation parallelism this runner can hold,
    # decided by the CYNIC binary from the observed memory. Waiting for it
    # is what makes the bound effective: a shard that starts before the
    # decision is published would compile with an unbounded parallelism.
    needs: [pool_eligibility]
    runs-on: [cynic/build]
