[package]
name = "cynic-release"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Sovereign Collective"]
description = "Pure decision engine for release validation, semver qualification, and public relay projection eligibility"
license = "MIT OR Apache-2.0"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir.workspace = true

[dev-dependencies]
tempfile = "3.17"
