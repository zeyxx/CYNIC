[project]
name = "cynic-data"
version = "0.1.0"
description = "CYNIC data-centric framework — offline instrument for the Capture/Canonical/Model/Projection pipeline."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cynic_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
