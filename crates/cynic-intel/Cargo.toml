[package]
name = "cynic-intel"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.18"
blake3.workspace = true
chrono.workspace = true
dirs.workspace = true
hex.workspace = true
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing.workspace = true
cynic-protocol = { path = "../cynic-protocol" }
cynic-solana-pay = { path = "../cynic-solana-pay" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-inference = { path = "../cynic-inference" }
regex = "1"

# Async test harness only: the crate's own surfaces stay runtime-agnostic behind
# async-trait, so tokio is never a build dependency of the library itself.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
