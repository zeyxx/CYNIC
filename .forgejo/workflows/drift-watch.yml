name: Sovereign Drift Watch

# Alarm when the sovereign line (Forgejo main) and the public projection
# (GitHub main) diverge. The 2026-10-23 split proved two merge doors with no
# comparison drift silently: GitHub absorbed #370 while Forgejo kept
# merging without it, and nothing compared the two mains.
#
# Alarm-only on purpose: the push-mirror from Forgejo to GitHub is async,
# so a mismatch right after a merge is transient lag, not a split. A red
# run that stays red for two consecutive hours is the real signal.
# It never blocks merges; it pages a human to converge.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  compare_mains:
    name: Compare sovereign and projection mains
    runs-on: [cynic/build]
    steps:
      - name: Checkout sovereign main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Compare main SHAs
        run: |
          set -eu
          sovereign=$(git rev-parse origin/main)
          projection=$(git ls-remote https://github.com/zeyxx/CYNIC.git refs/heads/main | cut -f1)
          echo "sovereign (forgejo): $sovereign"
          echo "projection (github): $projection"
          if [ "$sovereign" != "$projection" ]; then
            echo "DRIFT: sovereign main and public projection diverge."
            echo "Converge before any further merge on either side."
            exit 1
          fi
          echo "in sync: both mains carry $sovereign"
