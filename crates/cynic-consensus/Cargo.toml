[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fleet consensus, temporal monotonic synchronization, and DeploymentEpoch sequencer for CYNIC"
publish = false

[dependencies]
cynic-finance = { path = "../cynic-finance" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true

[dev-dependencies]
tempfile = "3.17"
