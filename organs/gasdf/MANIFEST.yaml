id: organ-gasdf
tier: 2
domain: gas-delegation
status: ACTIVE
framework: canonical-python-organ
systemd_executor: organ-gasdf.service

description: |
  GASdf Percolator node surface. The declared role is an off-chain gas
  delegation and fee-payer relay for the GASdf on-chain contract. The active
  runtime is now an organ-owned non-signing membrane that reports signing gates;
  fee-payer signing remains disabled until registry lifecycle approval, human
  approval and a dedicated signer adapter exist.

inputs:
  - source: infra/registry.json
    data: organ identity, role and deployment intent
  - source: operator environment
    data: fee-payer and RPC credentials supplied outside the repo

outputs:
  - path: organ-owned runtime membrane
    format: structured gate report
  - path: Solana RPC
    format: disabled until signer adapter and lifecycle approval exist

entrypoints:
  - name: src/entrypoints/cli.py
    description: Non-mutating GASdf membrane status and signing-policy gate report.

manual_gates:
  - no_committed_fee_payer_secret
  - no_signing_runtime_without_registry_and_human_approval
  - no_signer_adapter_without_audit_and_kernel_readback
