[package]
name = "cynic-pool"
version = "0.2.0"
edition = "2024"
authors = ["CYNIC Sovereign Collective"]
description = "Contribution pool protocol, types, difficulty adjustment, merkle proofs, and reward distribution for CYNIC"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
blake3.workspace = true
chrono.workspace = true
hex.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]

[[bin]]
name = "cynic-pool"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = []
