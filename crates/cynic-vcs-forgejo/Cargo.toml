[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-vcs-forgejo"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Sovereign Collective"]
description = "Forgejo API adapters and runtime for CYNIC sovereign VCS"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cynic-vcs = { path = "../cynic-vcs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3.17"

[lints]
workspace = true
