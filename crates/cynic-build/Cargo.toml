[package]
name = "cynic-build"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Team"]
description = "Sovereign build runner, compiler fault classification, and deterministic build proof pipeline for CYNIC"
license = "MIT OR Apache-2.0"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-workload = { path = "../cynic-workload" }
cynic-vcs = { path = "../cynic-vcs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono.workspace = true
hex.workspace = true
thiserror = "2.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
