name: CYNIC F-Gate (Forgejo)

on:
  push:
    branches: [main, "sync/*", "agent/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CYNIC_ALLOW_LOCAL_DEV_BUILD: "1"
  RUSTFLAGS: "-C debuginfo=0"
  POOL_LABEL: cynic/build

jobs:
  # Every suite is its own job so the pool can spread them across the
  # sovereign runners. A single monolithic job would pin the whole gate to
  # one runner and serialize the workspace compilation.
  derive_scope:
    name: Gate 0 Proof Scope Derivation
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive proof scope from the diff
        run: |
          set -eu
          # Admitted load: the shard set is a function of the diff, never a
          # constant. Changed crates plus their reverse dependents need a
          # proof; every other shard skips. Missing scope runs everything.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          run_tag="fgate-run-${GITHUB_RUN_ID:-local}"
          target_dir="${state_root}/build-targets/${run_tag}"
          mkdir -p "$target_dir"
          base=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          head=$(git rev-parse HEAD)
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            changed=""
          else
            changed=$(git diff --name-only "$base" "$head" || true)
          fi
          printf '%s\n' "$changed" > "$target_dir/changed-files.txt"
          python3 - "$target_dir" "$base" "$head" <<'PY'
          import json, os, subprocess, sys
          target_dir, base, head = sys.argv[1], sys.argv[2], sys.argv[3]
          changed_paths = []
          p = os.path.join(target_dir, "changed-files.txt")
          if os.path.exists(p):
              with open(p) as f:
                  changed_paths = [l.strip() for l in f if l.strip()]
          changed = set()
          for path in changed_paths:
              parts = path.split("/")
              if len(parts) >= 2 and parts[0] == "crates":
                  changed.add(parts[1])
          proof = set(changed)
          try:
              raw = subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1", "--no-deps"],
                  stderr=subprocess.DEVNULL, timeout=120,
              )
              names = {pkg["name"] for pkg in json.loads(raw).get("packages", [])}
              changed &= names
              proof &= names
              full = subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1"],
                  stderr=subprocess.DEVNULL, timeout=180,
              )
              nodes = {pkg["name"]: pkg.get("dependencies", []) for pkg in json.loads(full).get("packages", [])}
              rev = {n: set() for n in nodes}
              for name, deps in nodes.items():
                  for dep in deps:
                      dep_name = dep.get("name")
                      if dep_name in rev:
                          rev[dep_name].add(name)
              queue = list(changed)
              while queue:
                  cur = queue.pop()
                  for dependent in sorted(rev.get(cur, ())):
                      if dependent not in proof:
                          proof.add(dependent)
                          queue.append(dependent)
          except Exception:
              proof = set(changed)
          scope = {
              "$schema": "cynic.proof_scope.v1",
              "base": base,
              "head": head,
              "changed_crates": sorted(changed),
              "proof_crates": sorted(proof),
          }
          with open("scope.json", "w") as f:
              json.dump(scope, f, indent=2)
          with open(os.path.join(target_dir, "scope.json"), "w") as f:
              json.dump(scope, f, indent=2)
          print(json.dumps(scope))
          PY

  validate_json:
    name: Gate 1 Contract Validation
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Foundation & Infra JSON Contracts
        run: |
          set -eu
          for file in \
            contracts/foundation.json \
            infra/runtime-authority.json \
            infra/registry.json \
            infra/agent-exposure.json \
            infra/ecosystem-pins.json \
            infra/proof-scope.json \
            infra/build-policy.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"
            echo "OK $file"
          done

  check_compile:
    name: Gate 2 Workspace Compilation
    # Gate 0 publishes the compilation parallelism this runner can hold,
    # decided by the CYNIC binary from the observed memory. Waiting for it
    # is what makes the bound effective: a shard that starts before the
    # decision is published would compile with an unbounded parallelism.
    runs-on: [cynic/build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Rust toolchain (bare runner)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          fi
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Per-run isolated build cache (infra/directory-tree.json:
          # {state-root}/build-targets/<profile>). One directory per CI run:
          # shards of the same run share one compilation (first shard cold,
          # the rest warm); two runs never share one fingerprint space.
          # Cross-run sharing forged resolution errors (last-builder-wins
          # mtime lottery), so the target moved from the shared `fgate`
          # directory to `fgate-run-$GITHUB_RUN_ID`. Measured on builder-119,
          # 256s cold vs 96s warm; sccache still absorbs cross-run reuse.
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          run_tag="fgate-run-${GITHUB_RUN_ID:-local}"
          target_dir="${state_root}/build-targets/${run_tag}"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "target dir: $target_dir"
          # Route the compiler through the bounded compilation cache.
          # Measured on builder-119 before this line existed: 1521 Rust
          # cache MISSES against 129 hits — 97% of the compilations the
          # gate performs were recomputed from scratch. The shared target
          # directory only helps when the SAME crate is rebuilt in the
          # SAME directory; the cache helps when a crate is rebuilt in
          # ANY directory, which is what happens when the source moves
          # between a checkout, a worktree and a release build.
          #
          # Every shard has its OWN toolchain step, so each one must set
          # the wrapper: exporting it once in one shard does not reach
          # the others.
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "compilation cache: $(command -v sccache)"
          else
            echo "no compilation cache on this runner: the gate compiles cold"
          fi
          # Compilation parallelism, decided by the CYNIC binary from the
          # observed memory and published by Gate 0 in the shared target
          # directory. A missing or unreadable file means the decision was
          # not taken: the safe answer is ONE compilation at a time, never
          # the machine's core count.
          if [ -r "$target_dir/gate-jobs" ]; then
            jobs=$(cat "$target_dir/gate-jobs")
          else
            jobs=1
          fi
          case "$jobs" in
            ''|*[!0-9]*) jobs=1 ;;
          esac
          [ "$jobs" -ge 1 ] 2>/dev/null || jobs=1
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "compilation parallelism: $jobs"

      - name: Check Workspace Compilation
        run: cargo check --workspace

