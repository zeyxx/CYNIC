[package]
name = "kyon-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
surrealdb = { version = "1.0", features = ["kv-mem"] }
tokio = { version = "1.37.0", features = ["full"] }
async-trait = "0.1.79"
candle-core = "0.11.0"
kyon-zk = { path = "../kyon-zk" }

[lints.rust]
unsafe_code = "allow"
