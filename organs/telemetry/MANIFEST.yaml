id: organ-telemetry
tier: 2
domain: observability
status: ACTIVE
framework: hexagonal-organ

description: |
  Telemetry analysis organ for extracting, filtering, clustering and explaining
  local agent/runtime anomaly signals. The canonical runtime entrypoint is
  src/entrypoints/cli.py; root main.py remains a compatibility surface until
  external callers move to the bounded entrypoint.

inputs:
  - source: ~/.gemini/antigravity-cli/brain
    data: local Antigravity log stream
  - source: environment
    data: SURREALDB_URL and SURREALDB_PASS when telemetry persistence is enabled

outputs:
  - path: SurrealDB cynic/main
    format: telemetry anomaly records
  - path: stdout
    format: RCA report

scripts:
  - name: src/entrypoints/cli.py
    description: Canonical bounded entrypoint for the telemetry pipeline.
  - name: main.py
    description: Compatibility entrypoint retained for existing callers.
  - name: src/adapters/surreal_adapter.py
    description: SurrealDB persistence adapter for anomaly records.
  - name: src/pipeline/
    description: Extraction, heuristic, ML and LLM telemetry stages.

manual_gates:
  - no_unredacted_secret_logging
  - no_remote_persistence_without_explicit_environment_configuration
