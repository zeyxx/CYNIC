[package]
name = "cynic-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
rmcp = { version = "3.1.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[lints]
workspace = true
