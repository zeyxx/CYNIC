[package]
name = "cynic-anchor"
version = "0.30.0"
description = "CYNIC on-chain sovereign anchor program (PoH, Futarchy CPMM, Ignis Token-2022 Burn) built for Anchor 0.30+ / SVM"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cynic_anchor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }

[lints]
workspace = true
