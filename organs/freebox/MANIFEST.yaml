id: organ-freebox
tier: 2
domain: edge-network
status: ACTIVE
framework: canonical-python-organ

description: |
  Local edge router and firewall management organ for Freebox OS. The desired
  role is real. Provider mutation now lives behind bounded adapters, explicit
  port-forward intents and an approval gate; registry/Synapse authority remains
  the required evidence before declaring the organ fully canonical.

inputs:
  - source: registry and Kernel lifecycle requests
    data: explicit edge exposure intents and approved network targets
  - source: operator environment
    data: Freebox API credentials and physical-router approval state

outputs:
  - path: Freebox OS API
    format: provider mutation requests
  - path: kernel /observe
    format: edge network observations and blockers

remaining_debt:
  - registry must grow a first-class edge exposure schema consumed by --registry-intent-id before canonical promotion.

scripts:
  - name: src/entrypoints/cli.py
    description: Canonical entrypoint with separated Freebox core, adapter, and CLI layers.
    owner: organ-freebox
    integration_status: organ_entrypoint
    expiry_condition: none
manual_gates:
  - no_router_mutation_without_explicit_human_approval
  - no_committed_router_credentials_or_local_ip_policy
  - no_public_exposure_without_registry_and_synapse_contract
  - no_router_mutation_without_registry_intent_id_and_synapse_target
