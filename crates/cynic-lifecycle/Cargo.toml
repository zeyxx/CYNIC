[package]
name = "cynic-lifecycle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Deterministic runtime lifecycle, blue-green deployment, binary reconciliation and repair"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-storage = { path = "../cynic-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
