[package]
name = "cynic-mcp"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cynic-host = { path = "../cynic-host" }
cynic-lifecycle = { path = "../cynic-lifecycle" }
cynic-protocol = { path = "../cynic-protocol" }
rmcp = { version = "3.1.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[lints]
workspace = true
