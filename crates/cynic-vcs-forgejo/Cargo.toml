[package]
name = "cynic-vcs-forgejo"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Sovereign Collective"]
description = "Forgejo API adapters and runtime for CYNIC sovereign VCS"
license = "MIT OR Apache-2.0"

[dependencies]
cynic-vcs = { path = "../cynic-vcs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3.17"

[lints]
workspace = true
