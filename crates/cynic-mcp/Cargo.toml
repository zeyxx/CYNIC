[package]
name = "cynic-mcp"
version = "0.1.0"
edition = "2024"

[features]
legacy_infra_tools = []

[dependencies]
cynic-askesis = { path = "../cynic-askesis" }
cynic-host = { path = "../cynic-host" }
cynic-inference = { path = "../cynic-inference" }
cynic-node = { path = "../cynic-node" }
cynic-observer = { path = "../cynic-observer" }
cynic-protocol = { path = "../cynic-protocol" }
cynic-zeroclaw-solana = { path = "../cynic-zeroclaw-solana" }
rmcp = { version = "=3.1.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = "0.4"
glob = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"


[lints]
workspace = true
