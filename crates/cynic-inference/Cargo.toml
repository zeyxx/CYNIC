[package]
name = "cynic-inference"
version = "0.1.0"
edition = "2021"
description = "CYNIC Sovereign Inference Reactor (Judge & Dogs)"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
async-trait = "0.1"

[workspace]
