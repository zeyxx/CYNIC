[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-domain-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure domain models and reconciliation for external registrar/DNS provider operations"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-secrets = { path = "../cynic-secrets" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "stream"] }
tokio = { workspace = true }
cynic-askesis = { path = "../cynic-askesis" }

[dev-dependencies]
tempfile = "3.17"
