[package]
name = "cynic-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
chrono = "0.4"
libc = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["process", "io-util"] }
sysinfo = "0.39.6"

[dev-dependencies]
cynic-intel = { path = "../cynic-intel" }
tempfile = "3"
