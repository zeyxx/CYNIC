id: organ-browser
tier: 2
domain: tech-watch/browser
status: ACTIVE

description: |
  Sovereign browser perception and interaction organ.
  Uses NousResearch/hermes-agent as the upstream bootstrap for browser-capable agent tooling.
  Wraps meta-search (SearXNG), markdown extraction (Firecrawl), and Hermes-compatible browser interaction.
  Enforces zero leakage of secrets, automatic redactions, and strict human approvals for mutations.
  This organ is independent from organ-twitter, which owns the X/Twitter organ surface.
  Root-level scripts are closed legacy; browser operations live under src/entrypoints.

inputs:
  - source: cynic-kernel /agent-tasks
    data: browser tasks (search, scrape, interact) conforming to browser_task.schema.json
  - source: local configuration
    data: credentials and endpoints for SearXNG, Firecrawl, Hermes Agent browser backends, and browser CDP

outputs:
  - path: kernel /observe
    format: REST POST
    frequency: per-discovery
  - path: organs/browser/state/evidence/
    format: JSON / PNG
    frequency: per-task
  - path: organs/browser/state/action_ledger.jsonl
    format: JSONL
    frequency: per-action

crons:
  - organ-browser.service
  - organ-browser-hub.service

entrypoints:
  - name: src/entrypoints/activate_codex_browser_mcp.py
    description: Codex browser MCP activation entrypoint.
    owner: organ-browser
    integration_status: organ_entrypoint
    expiry_condition: none
  - name: src/entrypoints/diagnose_browser_mcp.py
    description: Browser MCP diagnostic entrypoint.
    owner: organ-browser
    integration_status: organ_entrypoint
    expiry_condition: none
  - name: src/adapters/mcp_diagnostics.py
    description: MCP protocol and systemd readiness probes for Browser MCP diagnostics.
    owner: organ-browser
    integration_status: organ_adapter
    expiry_condition: diagnose_browser_mcp.py remains a thin diagnostic membrane.
  - name: HERMES_BOOTSTRAP.md
    description: Contract binding organ-browser to NousResearch/hermes-agent as bootstrap substrate
    integration_status: transition_debt
    owner: organ-browser
    expiry_condition: track organ-browser membrane files or quarantine the organ
  - name: src/entrypoints/launch_browser.py
    description: Launch Chrome with organ-browser CDP profile
    integration_status: organ_entrypoint
    owner: organ-browser
    expiry_condition: none
  - name: src/entrypoints/browser_hub.py
    description: Browser Hub HTTP API for status, tabs, and public rendering
    integration_status: transition_debt
    owner: organ-browser
    expiry_condition: track organ-browser runtime files or quarantine the organ
  - name: src/adapters/hermes_agent_browser_adapter.py
    description: First Hermes-compatible browser backend adapter over the local organ-browser Hub
    integration_status: transition_debt
    owner: organ-browser
    expiry_condition: track organ-browser runtime files or quarantine the organ
  - name: src/entrypoints/mcp_server.py
    description: Thin process membrane for the Browser MCP stdio server
    integration_status: organ_entrypoint
    owner: organ-browser
    expiry_condition: none
  - name: src/adapters/mcp_server_runtime.py
    description: Browser MCP JSON-RPC runtime adapter over Browser Hub and Hermes-compatible tools
    integration_status: organ_adapter
    owner: organ-browser
    expiry_condition: mcp_server.py remains a thin process membrane
  - name: src/core/mcp_tools.py
    description: MCP tool policy and Hermes-compatible tool schema metadata
    integration_status: transition_debt
    owner: organ-browser
    expiry_condition: mcp_server entrypoint delegates tool metadata and policy builders to core
  - name: src/entrypoints/cli.py
    description: Trigger CLI for manual tests or direct execution
    integration_status: transition_debt
    owner: organ-browser
    expiry_condition: track organ-browser runtime files or quarantine the organ
