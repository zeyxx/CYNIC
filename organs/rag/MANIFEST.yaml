id: organ-rag
tier: 2
domain: retrieval-memory
status: ACTIVE
framework: canonical-python-organ

description: |
  Retrieval/memory contract surface. Active in-repo retrieval behavior is
  retired. The current runtime is non-mutating and only reports whether local
  historical state artifacts remain. Future retrieval behavior must be
  implemented behind Kernel storage and database-backed memory contracts.

retired_behaviors:
  - in_repo_vector_or_retrieval_state
  - active_retrieval_runtime_without_kernel_storage_contract

inputs:
  - source: organs/rag
    data: local retrieval-memory membrane inventory

outputs:
  - path: stdout
    format: cynic.rag.status.v1

manual_gates:
  - no_new_runtime_state_commits
  - no_active_retrieval_without_kernel_storage_contract
  - no_vector_state_inside_repo_source_tree

entrypoints:
  - name: src/entrypoints/cli.py
    description: Non-mutating retrieval-memory status report.
