[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-inference"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum.workspace = true
cynic-network = { path = "../cynic-network" }
cynic-protocol = { path = "../cynic-protocol" }
cynic-finance = { path = "../cynic-finance" }
cynic-knowledge = { path = "../cynic-knowledge" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-types = { path = "../cynic-types" }
cynic-eval = { path = "../cynic-eval" }
cynic-huggingface = { path = "../cynic-huggingface" }
cynic-pool = { path = "../cynic-pool" }
cynic-workload = { path = "../cynic-workload" }
cynic-consensus = { path = "../cynic-consensus" }
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.18"
tokio = { version = "1", features = ["process", "rt", "macros", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
