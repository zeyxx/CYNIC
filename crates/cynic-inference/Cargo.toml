[package]
name = "cynic-inference"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
cynic-protocol = { path = "../cynic-protocol" }
cynic-workload = { path = "../cynic-workload" }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["process", "rt", "macros", "sync", "time"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
