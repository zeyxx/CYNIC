[package]
name = "cynic-agent-gateway"
version = "0.1.0"
edition = "2021"
description = "Universal, polymorphic execution gateway for CYNIC to interface with SOTA agent frameworks (Hermes, OpenCode, etc.)"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
