[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-mcp"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "cynic-mcp"
path = "src/main.rs"

[dependencies]
cynic-host = { path = "../cynic-host" }
cynic-process = { path = "../cynic-process" }
cynic-protocol = { path = "../cynic-protocol" }
rmcp = { version = "3.1.0", features = ["server", "transport-io", "macros"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[lints]
workspace = true
