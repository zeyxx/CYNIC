[project]
name = "cynic-browser"
version = "0.1.0"
description = "Sovereign browser perception and interaction organ for CYNIC"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "playwright>=1.35.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "jsonschema>=4.17.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
