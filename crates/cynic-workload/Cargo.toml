[package]
name = "cynic-workload"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sovereign agent workload lifecycle: admission, claims, delivery, durability, settlement, and workspace reconciliation for CYNIC"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-vcs = { path = "../cynic-vcs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
