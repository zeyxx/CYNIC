[build]
# rustc can overflow or ICE on deep monomorphization (serde+rmcp = 47% of IR).
# rust-lang/rust #103767, #122357, #138561.
# jobs = 1 was set on that basis, with -j 2 declared "flaky under memory pressure".
#
# MEASURED 2026-10-07 on proxmox-forge, builder CT105 (rustc 1.95.0 via
# rust-toolchain.toml override, 8 GiB, 4 cores),
# full workspace cargo build --offline with a fresh target dir per run:
#   jobs = 1  : 641 s                                       rc=0
#   jobs = 2  : 282.00 / 261.66 / 247.52 / 252.76 s        rc=0 x4, 0 errors
#   reduction : 56 % to 61 %, mean 59.3 %, spread 34 s
#   peak RSS  : 1166 MiB at jobs = 1, 1255 MiB at jobs = 2 (+89 MiB, +7.6 %)
#   swaps     : 0 in every run
# The memory pressure cited for jobs = 1 does not exist here: two concurrent
# rustc cost about 1.25 GiB against 7.7 GiB available, and the peak barely
# moved because the two crates compiling at once are of unequal size.
#
# NOT MEASURED: jobs = 3 and jobs = 4. The optimal setting above 2 is unknown,
# so 2 is a measured safe point, not a proven optimum.
# NOT PROVEN: that 2 never trips the ICE on a future commit. Four clean runs
# bound that risk, they do not remove it. If an ICE appears, revert to 1 and
# record the commit that broke it.
# Proof: infra/runtime-checkpoints/2026-10-07-proxmox-host-substrate-observation.json
#   -> build_performance_diagnosis.repetition_across_commits
jobs = 2
# Convergence: clippy ICE mitigation for cold link-codegen under rustc 1.96.
# `--cap-lints=allow` + `-A clippy::all` suppresses workspace clippy denies
# (cli/src/lib.rs [workspace.lints]) that trigger SIGSEGV on full codegen
# (cargo build/link/run/test). clippy enforcement stays in `make check-strict`
# (RUSTFLAGS='-D warnings'). AGENS §7: adapter detail, swappable.
rustflags = ["-C", "debuginfo=0", "--cap-lints=allow", "-A", "clippy::all", "-C", "link-arg=-Wl,--no-check-sections"]

[env]
# Native C compile memory for cc-rs native builds (libsqlite3-sys/sqlite3.c
# is a single 8MB translation unit; -O0 under ~27GiB RAM SIGSEGVs cc).
# Data-centric: applies to native build.rs (sqlite3) without touching source.
CFLAGS = "-O0"
# Disable incremental compilation — the skill §"Stale incremental cache
# produces GHOST errors" (rustc 1.96: uninterned StableCrateId, inconsistent
# macro resolution, cstore decoder panic on serde_json::json expansion).
# These appear on cynac-host/node/mcp under 1.96 but vanish with incremental off.
# Non-destructive env-only (no cache wipe per §NEVER cargo clean).
CARGO_INCREMENTAL = "0"
# NOTE: RUST_MIN_STACK is NOT set in [env] — owned by the Makefile's RUST_ENV
# (CYNIC_RUST_MIN_STACK ?= 268435456, 256 MiB default) per cynic-dev-build skill.
# A legacy 64 MiB / 8 GiB value in [env] would shadow the Makefile and either
# SIGSEGV (8M) or OOM-kill runners <=32 GiB (8 GiB on cold link). Override via
# the Makefile var CYNIC_RUST_MIN_STACK or shell env RUST_MIN_STACK per run.
