[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-vcs"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Team"]
description = "Version Control System (VCS) domain and host adapters for CYNIC sovereign runtimes"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }
cynic-network = { path = "../cynic-network" }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
cynic-lifecycle = { path = "../cynic-lifecycle" }
tempfile = "3.17"
