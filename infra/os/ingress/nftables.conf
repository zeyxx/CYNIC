#!/usr/sbin/nft -f
# CYNIC Sovereign Ingress Bastion — nftables ruleset
# Kernel-level defense: Drop invalid, Anti-SYN flood, Strict Ingress Whitelist

flush ruleset

table inet filter {
    # Strict rate-limiting meter for anti-SYN flood
    set syn_flood {
        type ipv4_addr
        size 65535
        flags dynamic, timeout
        timeout 60s
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Established & Related traffic
        ct state established,related accept

        # 2. Drop invalid traffic immediately
        ct state invalid drop

        # 3. Loopback interface
        iif "lo" accept

        # 4. ICMP (ping) - bounded
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded } limit rate 5/second accept

        # 5. Anti-SYN flood protection on port 443 & 80
        tcp flags syn tcp dport { 80, 443 } meter syn_flood { ip saddr limit rate 30/second burst 50 packets } accept
        tcp flags syn tcp dport { 80, 443 } drop

        # 6. HTTP & HTTPS Ingress from Public Edge (Freebox redirect)
        tcp dport { 80, 443 } accept

        # 7. Management SSH — Internal Service Plane ONLY (10.10.10.0/24)
        ip saddr 10.10.10.0/24 tcp dport 22 accept
        ip saddr 192.168.0.0/24 tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
