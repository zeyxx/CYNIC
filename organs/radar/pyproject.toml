[project]
name = "cynic-radar"
version = "0.1.0"
description = "Sensory organ for CYNIC (Tech Watch & Uptime Monitoring)"
readme = "ORGAN_SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "loguru>=0.7"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
