[workspace]
members = [
    "crates/cynic-cli",
    "crates/cynic-protocol",
    "crates/cynic-types",
    "crates/cynic-discovery",
    "crates/cynic-discovery-host",
    "crates/cynic-inference",
    "crates/cynic-inference-runtime",
    "crates/cynic-agent-bus",
    "crates/cynic-agent-bus-server",
    "crates/cynic-agent-bus-coordinator",
    "crates/cynic-kernel",
    "crates/cynic-node",
    "crates/cynic-host",
    "crates/cynic-intel",
    "crates/cynic-intel-escore",
    "crates/cynic-intel-futarchy",
    "crates/cynic-observer",
    "crates/cynic-zeroclaw-solana",
    "crates/cynic-market",
    "crates/cynic-storage",
    "crates/cynic-mcp",
    "crates/cynic-vcs",
    "crates/cynic-vcs-forgejo",
    "crates/cynic-build",
    "crates/cynic-sandbox",
    "crates/cynic-lifecycle",
    "crates/cynic-network",
    "crates/cynic-solana-pay",
    "crates/cynic-identity",
    "crates/cynic-host-probes",
    "crates/cynic-intel-soc",
    "crates/cynic-consensus",
    "crates/cynic-channel",
    "crates/cynic-workload",
    "crates/cynic-forensics",
    "crates/cynic-release",
    "crates/cynic-lxc",
    "crates/cynic-pkg",
    "crates/cynic-pool",
    "crates/cynic-askesis",
    "crates/cynic-secrets",
    "crates/cynic-domain-ops",
    "crates/cynic-domain-askesis",
    "crates/cynic-domain-porkbun",
    "crates/cynic-domain-cloudflare",
]
resolver = "2"

[workspace.dependencies]
# Canonical versions — all crates must use `.workspace = true` to prevent duplication.
# Target: eliminate 79 duplicate packages in cargo tree.
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "blocking", "form"] }
tower-http = { version = "0.6", features = ["cors", "fs", "timeout", "trace"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1.10", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
blake3 = "1"
sha2 = "0.11"
sha3 = "0.10"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"
bitflags = "2"
bytes = { version = "1", features = ["serde"] }
http = "1"
http-body-util = "0.1"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
walkdir = "2"
which = "7"
dirs = "6"
toml = "0.8"
arc-swap = "1"
zeroize = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[workspace.package]
version = "0.8.0"
edition = "2024"
authors = ["CYNIC Sovereign Collective"]
license = "MIT OR Apache-2.0"

# ── Industrial lint configuration (Axum/Embark Studios baseline) ──
# Compiler lints = Layer 0 enforcement. 100% reliable, 0 context cost.
# Keep this file as compiler-enforced law. Do not encode runtime policy here.

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# Groups — priority -1/-2 so individual lints (priority 0) can override
# NOTE (ICE isolation, 2026-08): under rustc 1.96.0 the clippy *group* denies
# force a full MIR clippy pass on the serde_rmcp graph (cynic-protocol/host/node)
# → SIGSEGV linker ICE. `--cap-lints=allow` in .cargo/config CANNOT suppress
# `[workspace.lints]` (cargo appends them last). Per cynic-dev-build skill:
# clippy-group enforcement lives in `make check-strict` (`-D warnings`), not
# `make check`/`cargo test`. Relaxed to `allow` so codegen links green locally;
# individual safety lints (unwrap_used/expect_used/dbg_macro) stay `deny`.
correctness = "allow"
perf = "allow"
suspicious = "allow"
style = { level = "warn", priority = -3 }
# AI-specific (patterns LLMs frequently produce)
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
print_stderr = "warn"
map_err_ignore = "warn"
fallible_impl_from = "warn"
mem_forget = "warn"
rc_mutex = "warn"
disallowed_methods = "deny"
# Industrial quality (cherry-picked from Axum + Embark Studios)
enum_glob_use = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"
unused_self = "warn"

# ── Release profile ──
# opt-level=1 instead of 2/3: this repo has hit LLVM/rustc instability on
# deep serde+rmcp+schemars monomorphization during release-mode validation.
# This is a validation profile, not a benchmark profile; lower optimization is an
# acceptable tradeoff for deterministic CI/push gates. See rust-lang/rust #103767,
# #122357, #138561.
[profile.release]
opt-level = 1

[profile.dev]
# Disable incremental — rustc 1.96 + cynic-inference's async/rwlock graph =
# ghost errors (uninterned StableCrateId, serde_json::json inconsistent macro
# resolution, cstor decoder panic). The CARGO_INCREMENTAL=0 env var in
# .cargo/config.toml [env] is NOT enough (cargo [profile] wins); must be
# explicit here. Per cynic-dev-build skill §"Stale incremental cache ghost errors".
incremental = false
# WHY: codegen-units=1 was a mitigation for nightly-2026-04-06 LLVM fan-out SIGSEGV.
# As of Rust 1.95.0 / LLVM 22.1.2, codegen-units=1 itself triggers non-deterministic
# SIGSEGV in FastISel::selectInstruction on random crates (yoke-derive, zerovec,
# regex-syntax, serde_json). codegen-units=16 (default) passes 685 tests reliably.
# 
# PATCH (local ice isolation): clippy-deny groups + codegen-units=16 → MIR overflow
# SIGSEGV on cynic-protocol serde_json graph (rustc 1.96.0). Drop to 1 for the host
# axis (protocol/host/node/cli) to avoid parallel-codegen OOM/SIGSEGV locally.
# cynic-kernel stays on 16 (its own rust-toolchain 1.95 is unaffected).
codegen-units = 16
debug = false
[profile.dev.package.cynic-protocol]
codegen-units = 1

[profile.test]
# codegen-units=1 triggers non-deterministic SIGSEGV on large crates (kernel, node).
# codegen-units=16 is stable on both rustc 1.96 and 1.98.
codegen-units = 16
incremental = false
debug = false

[profile.test.package."*"]
debug = false
