id: organ-reflection
tier: 2
domain: synthesis
status: ACTIVE

description: |
  Reflection organ. Ingests dataset.jsonl from all other organs, synthesizes 
  events, and outputs askesis.jsonl for evaluation.

inputs:
  - source: organs/*/state/dataset.jsonl
    data: all organ events and traces

outputs:
  - path: ~/.cynic/organs/reflection/askesis.jsonl
    format: jsonl
  - path: kernel /observe (domain=reflection)
    format: REST POST

crons:
  - organ-reflection-cron.timer

scripts:
  - name: src/dispatch.py
    description: Hexagonal architecture entrypoint
  - name: src/entrypoints/cli.py
    description: Trigger CLI for manual tests

components:
  - name: src/core/data_organism.py
    description: Hermes data organism implementation for perception, analysis, reflection, synthesis, and compounding.
    integration_status: transition_debt
    owner: organ-reflection
    expiry_condition: data organism entrypoint remains a thin CLI membrane.
  - name: src/entrypoints/data_organism.py
    description: Thin CLI membrane for the Hermes data organism.
    integration_status: organ_entrypoint
    owner: organ-reflection
    expiry_condition: none
