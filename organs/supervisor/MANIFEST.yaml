id: organ-supervisor
tier: 1
domain: body-governance
status: ACTIVE
description: "CYNIC body supervisor - converts organ contract/runtime audits into guard decisions and repair queues"
framework: hexagonal-organ

inputs:
  - source: infra/registry.json
    data: declared organ identities, statuses, roles, dependencies, and runtime instances
  - source: organs/*/MANIFEST.yaml
    data: filesystem organ contracts
  - source: organs/*/systemd/*.service
    data: organ-local runtime unit declarations
  - source: infra/systemd/*.service
    data: organism-level runtime unit declarations

outputs:
  - path: CYNIC/organs/supervisor/state/SSOT.json
    format: curated_json
  - path: CYNIC/organs/supervisor/state/supervision.json
    format: generated_json
  - path: CYNIC/organs/supervisor/state/action-queue.jsonl
    format: degraded_queue_jsonl
  - path: CYNIC/organs/supervisor/state/organ-contract-audit.json
    format: generated_json
  - path: CYNIC/organs/supervisor/state/body-health.json
    format: generated_json
state_paths:
  - state/SSOT.json
  - state/supervision.json
  - state/action-queue.jsonl
  - state/organ-contract-audit.json
  - state/body-health.json

scripts:
  - name: controllers/supervise_body.py
    description: Build organ inventory, incoherence report, and repair suggestions without starting services.
  - name: controllers/validate_repo_topology.py
    description: Validate the repo topology machine contract and portable MCP path invariants.
components:
  - name: src/core/runtime_principals_actions.py
    description: Runtime principals command handlers and dispatcher wiring.
    integration_status: transition_debt
    owner: organ-supervisor
    expiry_condition: runtime principals actions entrypoint remains a thin command membrane.
  - name: src/core/runtime_principals_sequence.py
    description: Runtime principals operator sequence classification and deduplication helpers.
    integration_status: transition_debt
    owner: organ-supervisor
    expiry_condition: runtime principals sequence compatibility entrypoint remains a thin import membrane.
  - name: src/core/runtime_principals_infra_surfaces.py
    description: Runtime principals infra surface report helpers for storage, bridge, fleet, and mesh status.
    integration_status: transition_debt
    owner: organ-supervisor
    expiry_condition: runtime principals surface compatibility entrypoint remains a thin import membrane.
  - name: src/core/runtime_principals_organism_reports.py
    description: Runtime principals organism and activation report surface implementation.
    integration_status: transition_debt
    owner: organ-supervisor
    expiry_condition: runtime principals organism compatibility entrypoint remains a thin import membrane.
  - name: src/core/runtime_principals_runtime.py
    description: Runtime principal helper implementation for dedicated user, launchers, repo access, and projections.
    integration_status: transition_debt
    owner: organ-supervisor
    expiry_condition: runtime principals runtime compatibility entrypoint remains a thin import membrane.
  - name: src/core/runtime_principals_runtime_reports.py
    description: Runtime principal report implementation for status, plan, lifecycle, and MCP freshness surfaces.
    integration_status: transition_debt
    owner: organ-supervisor
    expiry_condition: runtime principals reports compatibility entrypoint remains a thin import membrane.
  - name: src/entrypoints/runtime_principals_views_runtime.py
    description: Thin compatibility facade for runtime principal helper imports.
    integration_status: organ_entrypoint
    owner: organ-supervisor
    expiry_condition: none
  - name: src/entrypoints/runtime_principals_views_runtime_reports.py
    description: Thin compatibility facade for runtime principal report helper imports.
    integration_status: organ_entrypoint
    owner: organ-supervisor
    expiry_condition: none
  - name: src/entrypoints/runtime_principals_actions.py
    description: Thin CLI membrane for runtime principal command dispatch.
    integration_status: organ_entrypoint
    owner: organ-supervisor
    expiry_condition: none
  - name: src/entrypoints/runtime_principals_views_organism.py
    description: Thin compatibility facade for runtime principal organism report imports.
    integration_status: organ_entrypoint
    owner: organ-supervisor
    expiry_condition: none

manual_gates:
  - no_public_submission_without_human_approval
  - no_new_organ_to_bypass_unhealthy_existing_organ
  - no_runtime_trust_without_declared_outputs_and_freshness
