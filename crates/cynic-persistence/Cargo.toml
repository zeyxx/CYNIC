[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-persistence"
version.workspace = true
edition.workspace = true
description = "CYNIC Storage — sovereign SMR event-sourced WAL and embedded state projections"
publish = false

[dependencies]
chrono = "0.4"
cynic-protocol = { path = "../cynic-protocol" }
cynic-surreal = { path = "../cynic-surreal" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-consensus = { path = "../cynic-consensus" }
cynic-finance = { path = "../cynic-finance" }
bytes.workspace = true
hex.workspace = true
parking_lot = "0.12"
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
smallvec = { version = "1", features = ["serde"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
