[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-network"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure domain models, routing topologies, WireGuard actuation, and network probes for CYNIC"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }
cynic-secrets = { path = "../cynic-secrets" }
reqwest.workspace = true
hmac.workspace = true
sha1.workspace = true
cynic-finance = { path = "../cynic-finance" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono.workspace = true
sysinfo = "0.37"
toml = "0.8"
dirs = "6.0"
which = "7.0"
walkdir = "2.5"
regex = "1"
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true
blake3.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = "3.17"
