id: organ-forge
tier: 2
domain: infrastructure
status: ACTIVE

description: |
  Sovereign forge lifecycle organ. Perceives Forgejo, git DAG state,
  coordination claims, lifecycle dispatches, and build evidence.
  Extracts actionable intelligence about the CYNIC project without treating
  GitHub or raw git commands as the priority agency/privacy lifecycle authority.

ports:
  - CoordinationPort
  - LifecycleDispatchPort
  - InfraRegistryPort
  - ObservationPort

inputs:
  - source: Forgejo
    data: sovereign forge repositories, branches, reviews, protected refs, and build/release evidence
  - source: git log / status
    data: local git DAG history and working tree membrane state
  - source: make gate
    data: cortex-local validation evidence, never canonical release proof

outputs:
  - path: kernel /observe (domain=forge)
    format: REST POST
    frequency: per-ingest
  - path: ~/.cynic/organs/forge/dataset.jsonl
    format: jsonl
    frequency: per-ingest

crons:
  - organ-forge-cron.timer

scripts:
  - name: src/dispatch.py
    description: Hexagonal architecture entrypoint
  - name: src/entrypoints/cli.py
    description: Thin CLI membrane for organ-forge operators and lifecycle requests
components:
  - name: src/core/cli_runtime.py
    description: Organ-forge CLI runtime, command parser, audit, daemon, delegate, and lifecycle dispatch handlers.
    integration_status: transition_debt
    owner: organ-forge
    expiry_condition: src/entrypoints/cli.py remains a thin CLI membrane.
  - name: src/core/lifecycle_diagnostic_payloads.py
    description: Pure lifecycle diagnostic payload parsing, projection, and dispatch error classification.
    integration_status: transition_debt
    owner: organ-forge
    expiry_condition: lifecycle diagnostic entrypoint remains a thin JSON CLI membrane.
  - name: src/core/agent_proposals.py
    description: Pure proposal envelope builder for forge lifecycle tasks exposed through Kernel /agent-proposals.
    integration_status: active
    owner: organ-forge
