name: Bug Report
description: Create a report to help us improve CYNIC
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please note that security vulnerabilities should be reported privately via the Security tab.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: affected-crates
    attributes:
      label: Affected Crate(s)
      description: e.g. cynic-protocol, cynic-kernel, cynic-network
      placeholder: cynic-kernel
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the observed behavior?
      placeholder: |
        1. Run `cargo check -p ...`
        2. Execute `cynic ...`
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, Rust toolchain version (`rustc --version`), CPU architecture.
      value: |
        - OS: Linux
        - Rustc: 
        - Target Architecture: 
    validations:
      required: true
