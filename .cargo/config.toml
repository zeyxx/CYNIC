[build]
# rustc 1.94 LLVM stack overflow on deep monomorphization (serde+rmcp = 47% of IR).
# rust-lang/rust #103767, #122357, #138561.
# -j 1 is the only reliable setting; -j 2 is flaky under memory pressure.
jobs = 1
rustflags = ["-C", "debuginfo=1"]

[env]
# A1 debt: rmcp/serde monomorphization can overflow rustc stack in kernel test builds.
# Keep this bounded for heterogeneous build runners; 16GiB stack reservations make
# rustc fail to spawn its control-C handler on smaller VMs.
RUST_MIN_STACK = "33554432"
