[package]
name = "cynic-node"
version.workspace = true
edition.workspace = true
publish = false
default-run = "cynic-node"

[[bin]]
name = "cynic-node"
path = "src/main.rs"

[[bin]]
name = "cynic-network-actuator"
path = "src/actuator_main.rs"

[[bin]]
name = "cynic-node-enroll"
path = "src/bin/enroll_grant.rs"

[dependencies]
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util.workspace = true
http = "1.1"
reqwest.workspace = true
process-wrap = { version = "9.1", features = ["tokio1"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
tracing.workspace = true
tracing-subscriber.workspace = true
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
chrono.workspace = true
sysinfo = "0.33"
tempfile = "3"
sha2 = "0.10.8"
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
rusqlite = { version = "0.34", features = ["bundled"] }
zeroize.workspace = true
cynic-protocol = { path = "../cynic-protocol" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-workload = { path = "../cynic-workload" }
cynic-vcs = { path = "../cynic-vcs" }
cynic-storage = { path = "../cynic-storage" }
cynic-build = { path = "../cynic-build" }
cynic-host = { path = "../cynic-host" }
cynic-lifecycle = { path = "../cynic-lifecycle" }
cynic-network = { path = "../cynic-network" }
cynic-consensus = { path = "../cynic-consensus" }
cynic-intel-soc = { path = "../cynic-intel-soc" }
cynic-inference = { path = "../cynic-inference" }
cynic-release = { path = "../cynic-release" }
cynic-lxc = { path = "../cynic-lxc" }
cynic-sandbox = { path = "../cynic-sandbox" }
async-trait.workspace = true
axum.workspace = true
hmac = "0.12"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }


[dev-dependencies]

[lints]
workspace = true
