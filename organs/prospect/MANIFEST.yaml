id: organ-prospect
name: organ-prospect
tier: 2
domain: local-business-acquisition
status: planned
framework: canonical-python-organ

description: |
  Local commercial prospecting organ. It turns a niche and geography into
  structured prospect/audit JSONL for human review, Hermes-Agent enrichment,
  and later delivery workflows.

capabilities:
  - sovereign_local_market_search
  - browser_sourcing_task_generation
  - website_audit
  - prospect_scoring
  - outreach_message_generation

inputs:
  - source: CLI
    data: niche, city, radius label, manual URL list, optional local SearXNG URL
  - source: local SearXNG
    data: public search results through a CYNIC-controlled local membrane
  - source: organ-browser
    data: read-only browser evidence converted to URL lists

outputs:
  - path: stdout
    format: cynic.prospect.batch.v1
  - path: stdout or JSON file with --emit-browser-task
    format: CYNIC Browser Organ Task
  - path: JSONL file when --output is provided
    format: cynic.prospect.v1

manual_gates:
  - no_unsolicited_sending
  - human_review_before_outreach
  - no_secret_storage
  - no_provider_write_without_explicit_operator_intent
  - no_public_search_engine_scraping_by_default
  - local_search_provider_must_be_operator_controlled

entrypoints:
  - name: src/entrypoints/cli.py
    description: Generate scored local-business prospects from manual URLs or a local SearXNG membrane.
