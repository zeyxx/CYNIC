description = "Host registry profiles, resolution, and runtime registry path discovery for CYNIC"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-process = { path = "../cynic-process" }
cynic-network = { path = "../cynic-network" }
cynic-types = { path = "../cynic-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono.workspace = true
thiserror = "2.0"
tracing.workspace = true

[dev-dependencies]
tempfile = "3.17"
