          [ "$jobs" -ge 1 ] 2>/dev/null || jobs=1
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "compilation parallelism: $jobs"

      - name: Run Core Types Test Suite
        run: |
          set -eu
          state_root="${CYNIC_STATE_DIR:-$HOME/.local/share/cynic}"
          run_tag="fgate-run-${GITHUB_RUN_ID:-local}"
          scope_file="${state_root}/build-targets/${run_tag}/scope.json"
          if [ -r "$scope_file" ] && ! python3 - "$scope_file" cynic-types <<'PY'
          import json,sys
          scope_path, crate = sys.argv[1], sys.argv[2]
          try:
              scope = json.load(open(scope_path))
          except Exception:
              sys.exit(0)
          proof = scope.get("proof_crates") or []
          sys.exit(0 if (proof and crate in proof) else 1)
          PY
          then
            echo "scope skip: cynic-types unchanged by this diff, already proven by the base run"
            exit 0
          fi
          cargo test -p cynic-types

