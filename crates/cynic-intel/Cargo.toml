[package]
name = "cynic-intel"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
blake3 = "1"
chrono = "0.4"
dirs = "6"
hex = "0.4"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = "0.1"
cynic-protocol = { path = "../cynic-protocol" }
cynic-intel-soc = { path = "../cynic-intel-soc" }
cynic-inference = { path = "../cynic-inference" }
regex = "1"

# Async test harness only: the crate's own surfaces stay runtime-agnostic behind
# async-trait, so tokio is never a build dependency of the library itself.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
