name: organ-wireguard
domain: synapse-mesh
domain_role: legacy_private_service_mesh_implementation
role: legacy_synapse_mesh_implementation
description: "Legacy WireGuard compatibility shim retained for reports and migration evidence; canonical network control already lives in cynic-node and organ-fleet."
version: 0.2.0
status: legacy_blocked
dependencies:
  - cynic-kernel
interfaces:
  compatibility_reports:
    - report_mesh_status
  dns_projection:
    - render_synapse_hosts
    - sync_synapse_hosts
    - plan_synapse_dns_activation
    - bundle_synapse_dns_activation
    - report_synapse_dns_activation_status
    - report_synapse_dns_provider_policy
  provider_fallback:
    - render_temporary_provider_hosts
    - report_temporary_provider_fallback_status
state_paths:
  - desired/state.json
  - state/SSOT.json
scripts:
  - name: src/entrypoints/cli.py
    description: Thin legacy CLI membrane for compatibility reports, DNS bundles, and provider fallback helpers
    integration_status: organ_entrypoint
    owner: organ-wireguard
    expiry_condition: all remaining compatibility callers move to organ-fleet or cynic-node
  - name: src/adapters/cli_runtime.py
    description: Legacy compatibility implementation forwarding report surfaces and fallback helpers to organ-fleet
    integration_status: transition_debt
    owner: organ-wireguard
    expiry_condition: all compatibility callers move to organ-fleet and the shim can be deleted
runbooks:
  - runbooks/operations.json
commands:
  validate:
    - python3 organs/wireguard/src/entrypoints/cli.py validate --registry infra/registry.json
  mesh_status:
    - python3 organs/wireguard/src/entrypoints/cli.py status --resolve-dns --include-records --registry infra/registry.json
  sync_dns_plan:
    - python3 organs/wireguard/src/entrypoints/cli.py status --include-records --registry infra/registry.json
  dns_activation_plan:
    - python3 organs/wireguard/src/entrypoints/cli.py dns plan
  dns_activation_bundle:
    - python3 organs/wireguard/src/entrypoints/cli.py dns bundle --registry infra/registry.json --output-dir /tmp/cynic-synapse-dns
  dns_activation_status:
    - python3 organs/wireguard/src/entrypoints/cli.py dns activation-status --resolve-dns
  provider_fallback_hosts:
    - python3 organs/wireguard/src/entrypoints/cli.py fallback-hosts --registry infra/registry.json --output-dir /tmp/cynic-provider-fallback
  provider_fallback_status:
    - python3 organs/wireguard/src/entrypoints/cli.py fallback-status --registry infra/registry.json --check-connectivity
