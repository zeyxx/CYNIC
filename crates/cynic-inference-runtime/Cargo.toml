[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-inference-runtime"
version = "0.1.0"
edition = "2024"
description = "CYNIC inference runtime — application services and use cases"
publish = false

[dependencies]
cynic-inference = { path = "../cynic-inference" }
cynic-protocol = { path = "../cynic-protocol" }
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow = "1"
thiserror.workspace = true
ulid = "1"
hex.workspace = true
sha2.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
