id: organ-contracts
name: organ-contracts
tier: 1
domain: contracts
role: shared_surface_contracts
description: "Owns shared command/report surface contracts and universal registry primitives."
version: 0.1.0
status: active
owner: organ-supervisor
dependencies: []
inputs:
  sources:
    - organs/*/src
outputs:
  shared_surface_contracts:
    format: python_module
    command: python3 organs/contracts/src/entrypoints/cli.py surface-manifest
rules:
  - contracts_must_be_framework_agnostic
  - contracts_must_remain_json_serializable
  - shared_contracts_must_not_import_organ_business_logic
