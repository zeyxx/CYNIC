[package]
name = "cynic-domain-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure domain models and reconciliation for external registrar/DNS provider operations"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-secrets = { path = "../cynic-secrets" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.17"
