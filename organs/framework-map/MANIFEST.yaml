id: organ-framework-map
name: organ-framework-map
tier: 2
domain: framework-cartography
role: external_framework_cartographer
description: "Maps external agent frameworks into CYNIC capability, dependency, architecture and compatibility reports without absorbing the framework into CYNIC."
version: 0.1.0
status: active
owner: organ-supervisor
framework: canonical-python-organ
dependencies:
  - organ-contracts
inputs:
  sources:
    - external/hermes-agent/
    - local checkout path passed via --source-root
outputs:
  framework_map:
    format: json
    schema: cynic.framework_map.report.v1
    command: python3 organs/framework-map/src/entrypoints/cli.py map-hermes
state_paths:
  - state/
rules:
  - observe_external_frameworks_without_vendoring_them
  - reuse_organ_contracts_dependency_and_capability_ports
  - publish_gaps_as_json_not_markdown
  - core_must_remain_io_free
