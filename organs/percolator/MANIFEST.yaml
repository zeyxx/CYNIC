id: organ-percolator
tier: 2
domain: security-bounty
status: declared
description: "Percolator bounty workflow organ — rules, duplicate intelligence, findings, proof gates, and submission queue"
framework: hexagonal-organ

inputs:
  - source: CYNIC/organs/percolator/desired/percolator-bounty.json
    data: bounty desired state and rules
  - source: percolator/ops/researcher-feed.json
    data: Discord-derived researcher and GitHub duplicate signals
  - source: percolator/upstream
    data: local upstream repository clones for code review

outputs:
  - path: organs/percolator/state/SSOT.json
    format: generated_json
  - path: percolator/ops/infer-queue.jsonl
    format: degraded_queue_jsonl

planned_outputs:
  - path: percolator/workspace.json
    format: generated_json
  - path: percolator/notes/bounty-rules.json
    format: generated_json
  - path: percolator/notes/audit-plan.json
    format: generated_json
  - path: percolator/ops/anti-duplicate-protocol.json
    format: generated_json
  - path: percolator/ops/finding-board.json
    format: work_product_json
  - path: percolator/audits/_candidates
    format: work_product_directory

crons:
  - discord-pipeline.service
  - organ-discord-cron.timer

scripts:
  - name: controllers/reconcile_percolator.py
    description: Reconcile Percolator desired state into generated workspace views while preserving finding work products.
  - name: controllers/build_dedupe_brief.py
    description: Build duplicate intelligence from the Discord researcher feed.

manual_gates:
  - no_github_issue_without_human_approval
  - no_discord_post_without_human_approval
  - no_high_or_critical_wording_without_concrete_impact_proof
  - no_submission_with_unresolved_duplicate_overlap
