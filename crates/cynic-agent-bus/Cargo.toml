[package]
name = "cynic-agent-bus"
version = "0.1.0"
edition = "2024"
description = "CYNIC sovereign agent bus — coordination, claims, proofs"

[dependencies]
# Domain types
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }

# Crypto
ed25519-dalek.workspace = true
blake3.workspace = true
sha2 = "0.10"
rand = "0.9.0"

# Async
tokio = { version = "1", features = ["full"] }
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
thiserror.workspace = true
tracing.workspace = true
ulid = "1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"
