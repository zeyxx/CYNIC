<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALARIA // Unipersonal Blockchain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <header class="terminal-header">
            <div class="header-left">
                <h1>TALARIA <span class="badge">SYS.VERIFIED</span></h1>
                <p class="subtitle">UNIPERSONAL BLOCKCHAIN // ROOT: $ASDFASDFA</p>
            </div>
            <div class="header-right">
                <div class="stat">
                    <span class="label">STATUS</span>
                    <span class="value text-green">SYNCED</span>
                </div>
                <div class="stat">
                    <span class="label">BLOCK</span>
                    <span class="value" id="block-height">849021</span>
                </div>
            </div>
        </header>

        <div class="mempool-wrapper">
            <div class="mempool-header">
                <h2>> LIVE_MEMPOOL</h2>
                <div class="pulse"></div>
            </div>
            <div class="mempool-feed" id="feed">
                <!-- Data will stream here via JS -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
