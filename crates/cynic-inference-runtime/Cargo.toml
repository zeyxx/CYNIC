[package]
name = "cynic-inference-runtime"
version = "0.1.0"
edition = "2024"
description = "CYNIC inference runtime — application services and use cases"

[dependencies]
cynic-inference = { path = "../cynic-inference" }
cynic-protocol = { path = "../cynic-protocol" }
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow = "1"
thiserror = "1"
ulid = "1"
hex.workspace = true
sha2 = "0.10"
chrono.workspace = true
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
