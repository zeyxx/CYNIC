name: CYNIC CI & Verification Gate

on:
  push:
    branches: [main, "sync/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CYNIC_ALLOW_LOCAL_DEV_BUILD: "1"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  verify:
    name: Layer 0-4 Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Foundation & Infra JSON Contracts
        id: validate_json
        run: |
          jq empty contracts/foundation.json
          jq empty infra/runtime-authority.json
          jq empty infra/registry.json
          jq empty infra/agent-exposure.json
          jq empty infra/ecosystem-pins.json

      - name: Check Workspace Compilation
        id: check_compile
        run: cargo check --workspace

      # Test suites run with continue-on-error so every suite executes to
      # completion in one job instead of fail-fast truncating the report.
      # The raw result survives in steps.<id>.outcome; the final
      # "Aggregate Test Suite Verdict" step is the single gate that decides
      # the job's fate. See docs/design/CI_EVOLUTION.md.
      #
      # The gate runs the whole workspace, not four crates.
      #
      # It used to run `cargo test -p cynic-types`, `-p cynic-knowledge`,
      # `-p cynic-inference` and one `cynic-cli` integration test. That left
      # 42 of the 46 workspace crates untested on every pull request, and
      # the gap was not theoretical:
      #
      #   * pull request #350 passed CI green and then failed 11 tests on
      #     the builder, in `cynic-build`;
      #   * `cynic-channel`'s settlement balance test had been failing
      #     since the file was introduced, because no gate ever ran it.
      #
      # The tests are cheap: the 18 suites take about 81 seconds. The cost
      # is the compile, and `cargo check --workspace` above already pays
      # most of it.
      #
      # `cargo test --workspace --locked` is also exactly what the release
      # workflow demands before a tag. The pull-request gate and the
      # release gate now test the same thing.

      - name: Run Workspace Test Suite
        id: test_workspace
        continue-on-error: true
        run: cargo test --workspace --locked

      - name: Aggregate Test Suite Verdict
        if: always()
        env:
          JSON_VALIDATION_OUTCOME: ${{ steps.validate_json.outcome }}
          COMPILE_OUTCOME: ${{ steps.check_compile.outcome }}
          WORKSPACE_OUTCOME: ${{ steps.test_workspace.outcome }}
        run: |
          set -u

          # A hard gate that did not run successfully means the suites were never
          # all executed; that is a failure of the run, not of a suite.
          hard_gate_failed=0
          for entry in "validate_json:${JSON_VALIDATION_OUTCOME}" \
                       "check_compile:${COMPILE_OUTCOME}"; do
            gate="${entry%%:*}"
            outcome="${entry#*:}"
            if [ "${outcome}" != "success" ]; then
              hard_gate_failed=1
              printf '  %-18s %s (hard gate)\n' "${gate}" "${outcome}"
            fi
          done

          # `outcome` is the raw step result before continue-on-error is applied,
          # so `failure` here is a genuinely failing suite.
          failed_suites=""
          skipped_suites=""
          for suite in workspace; do
            var="$(printf '%s_OUTCOME' "${suite}" | tr '[:lower:]' '[:upper:]')"
            outcome="${!var}"
            printf '  %-18s %s\n' "${suite}" "${outcome}"
            case "${outcome}" in
              failure|timed_out) failed_suites="${failed_suites} ${suite}" ;;
              skipped) skipped_suites="${skipped_suites} ${suite}" ;;
            esac
          done

          if [ "${hard_gate_failed}" -eq 1 ]; then
            echo "::error::Aggregate verdict: FAIL — a hard gate did not succeed, so the suites did not all execute."
          fi
          if [ -n "${failed_suites}" ]; then
            echo "::error::Aggregate verdict: FAIL — failing suites:${failed_suites}"
          fi
          if [ -n "${skipped_suites}" ] && [ "${hard_gate_failed}" -eq 0 ]; then
            echo "::warning::Aggregate verdict: suites skipped without a broken hard gate:${skipped_suites}"
          fi

          if [ "${hard_gate_failed}" -eq 1 ] || [ -n "${failed_suites}" ]; then
            echo "Aggregate verdict: FAIL"
            verdict="FAIL"
          else
            echo "Aggregate verdict: PASS — every executed test suite succeeded."
            verdict="PASS"
          fi

          # Gate receipt: machine-readable proof of what ran and what it said.
          # Audits the audit — a green job without this file is suspect.
          printf '{"gate":"layer-0-4","verdict":"%s","sha":"%s","run_id":"%s","ts":"%s","gates":{"validate_json":"%s","check_compile":"%s","workspace":"%s"}}\n' \
            "${verdict}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "$(date -u +%FT%TZ)" \
            "${JSON_VALIDATION_OUTCOME}" "${COMPILE_OUTCOME}" "${WORKSPACE_OUTCOME}" \
            > gate-receipt.json
          cat gate-receipt.json

          if [ "${verdict}" = "FAIL" ]; then
            exit 1
          fi

      - name: Upload Gate Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt-${{ github.run_id }}
          path: gate-receipt.json
          retention-days: 90
