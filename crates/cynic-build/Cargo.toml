[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-build"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Team"]
description = "Sovereign build runner, compiler fault classification, and deterministic build proof pipeline for CYNIC"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cynic-agent = { path = "../cynic-agent" }
cynic-protocol = { path = "../cynic-protocol" }
cynic-release = { path = "../cynic-release" }
cynic-node-protocol = { path = "../cynic-node-protocol" }
cynic-types = { path = "../cynic-types" }
cynic-network = { path = "../cynic-network" }
hmac.workspace = true
reqwest.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
chrono.workspace = true
hex.workspace = true
thiserror = "2.0"
libc = "0.2"
sysinfo = "0.39.6"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.17"
