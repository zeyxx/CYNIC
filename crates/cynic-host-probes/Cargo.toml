[package]
name = "cynic-host-probes"
version = "0.1.0"
edition = "2024"
description = "Hardware probes for CYNIC host substrate"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
sysinfo = "0.37"
tracing = "0.1"
dirs = "6"
reqwest = { version = "0.13", features = ["json"] }
which = "7"
walkdir = "2"
regex = "1"

[lints]
workspace = true
