[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-lxc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[example]]
name = "cynic-lxc-exec-bridge"
path = "examples/lxc_exec_bridge_demo.rs"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
