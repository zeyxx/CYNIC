[package]
name = "cynic-intel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
blake3 = "1"
hex = "0.4"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
cynic-protocol = { version = "0.1.0", path = "../cynic-protocol" }

# Async test harness only: the crate's own surfaces stay runtime-agnostic behind
# async-trait, so tokio is never a build dependency of the library itself.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
