[package]
name = "cynic-agent-bus"
version = "0.1.0"
edition = "2024"
description = "CYNIC sovereign agent bus — coordination, claims, proofs"

[dependencies]
# Domain types
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
sha2 = "0.10"
rand = "0.9.0"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
thiserror = "2"
tracing = "0.1"
ulid = "1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"
