[package]
name = "cynic-host"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-inference = { path = "../cynic-inference" }
cynic-vcs = { path = "../cynic-vcs" }
cynic-build = { path = "../cynic-build" }
cynic-sandbox = { path = "../cynic-sandbox" }
# The lease store persists DateTime<Utc> lease deadlines to disk, so chrono's
# serde impls are required. cynic-kernel already declares it this way; cynic-host
# did not, because no compiled module had ever needed it.
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10.8"
hmac = "0.12"
sha1 = "0.10"
tokio = { version = "1.50.0", features = ["process", "io-util", "time", "rt", "rt-multi-thread", "macros"] }
async-trait = "0.1"
sysinfo = "0.39.6"
zeroize = "1"
ed25519-dalek = "2"
regex = "1"
walkdir = "2"
thiserror = "1"
rand = "0.8"
rpassword = "7.5.4"

[dev-dependencies]
tempfile = "3"
# adversarial_red_team_suite and multi_agent_e2e_simulation both import
# cynic_intel::{escore, futarchy}. The crate exists and exports them; it was
# simply never declared as a dependency, so neither suite could compile.
cynic-intel = { path = "../cynic-intel" }
