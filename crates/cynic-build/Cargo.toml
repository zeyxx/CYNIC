[package]
name = "cynic-build"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Team"]
description = "Sovereign build runner, compiler fault classification, and deterministic build proof pipeline for CYNIC"
license = "MIT OR Apache-2.0"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-vcs = { path = "../cynic-vcs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
