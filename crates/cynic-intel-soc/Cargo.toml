[package]
name = "cynic-intel-soc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Host, hardware, kernel, and network threat telemetry SOC analysis engine for CYNIC"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-network = { path = "../cynic-network" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.17"
