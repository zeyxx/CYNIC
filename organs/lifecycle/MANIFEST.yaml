name: organ-lifecycle
role: repo_lifecycle_manager
description: "Unified organ for sovereign CI/CD, container runtime, smart contract testing, and git operations. Replaces forge, fabric, docker, vercel, and anvil."
version: 1.0.0
dependencies:
  - cynic-kernel
interfaces:
  mempool:
    - fetch_pending_tasks
    - claim_task
    - submit_result
  git:
    - get_latest_commit
    - create_pull_request
    - merge_pull_request
  provisioning:
    - provision_vm
    - destroy_vm
  container_runtime:
    - deploy_container
    - get_container_logs
  serverless_hosting:
    - deploy_project
  smart_contract:
    - execute_tests
    - deploy_contract
state_paths:
  - desired/state.json
  - state/SSOT.json
runbooks:
  - runbooks/operations.json
