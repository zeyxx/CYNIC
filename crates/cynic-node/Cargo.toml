[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-node"
version.workspace = true
edition.workspace = true
publish = false
default-run = "cynic-node"

[[bin]]
name = "cynic-node"
path = "src/main.rs"

[dependencies]
cynic-agent = { path = "../cynic-agent" }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util.workspace = true
http = "1.1"
reqwest.workspace = true
process-wrap = { version = "9.1", features = ["tokio1"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
tracing.workspace = true
tracing-subscriber.workspace = true
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
chrono.workspace = true
sysinfo = "0.33"
tempfile = "3"
sha2.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
fips204.workspace = true
rusqlite = { version = "0.34", features = ["bundled"] }
zeroize.workspace = true
cynic-protocol = { path = "../cynic-protocol" }
cynic-types = { path = "../cynic-types" }
cynic-supervisor = { path = "../cynic-supervisor" }
cynic-proxmox = { path = "../cynic-proxmox" }
cynic-finance = { path = "../cynic-finance" }
cynic-node-protocol = { path = "../cynic-node-protocol" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-vcs = { path = "../cynic-vcs" }
cynic-persistence = { path = "../cynic-persistence" }
cynic-build = { path = "../cynic-build" }
cynic-host = { path = "../cynic-host" }
cynic-process = { path = "../cynic-process" }
cynic-network = { path = "../cynic-network" }
cynic-ssh = { path = "../cynic-ssh" }
cynic-consensus = { path = "../cynic-consensus" }
cynic-inference = { path = "../cynic-inference" }
cynic-intel = { path = "../cynic-intel" }
cynic-release = { path = "../cynic-release" }
cynic-lxc = { path = "../cynic-lxc" }
cynic-sandbox = { path = "../cynic-sandbox" }
cynic-market = { path = "../cynic-market" }
cynic-pool = { path = "../cynic-pool" }
async-trait.workspace = true
thiserror = "2"
axum.workspace = true
hmac.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["resource"] }
rustix = { version = "1", features = ["fs"] }


[dev-dependencies]

[lints]
workspace = true
