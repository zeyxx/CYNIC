[package]
name = "cynic-types"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Layer 0 atomic types: AgentId, Hash32, Budget, Scope, TaskId, Timestamp"

[dependencies]
serde = { version = "1", features = ["derive"] }
