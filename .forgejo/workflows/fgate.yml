      - test_inference
      - test_canonical_paths
    runs-on: [cynic/build]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggregate Test Suite Verdict
        env:
          SCOPE_DERIVATION_OUTCOME: ${{ needs.derive_scope.result }}
          JSON_VALIDATION_OUTCOME: ${{ needs.validate_json.result }}
          COMPILE_OUTCOME: ${{ needs.check_compile.result }}
          CORE_TYPES_OUTCOME: ${{ needs.test_core_types.result }}
          KNOWLEDGE_OUTCOME: ${{ needs.test_knowledge.result }}
          INFERENCE_OUTCOME: ${{ needs.test_inference.result }}
          CANONICAL_PATHS_OUTCOME: ${{ needs.test_canonical_paths.result }}
        run: |
          set -u

          hard_gate_failed=0
          invalid=0
          check_hard() {
            case "$2" in
              success) printf '  %-18s success\n' "$1" ;;
              "") printf '  %-18s MISSING (no result)\n' "$1"; invalid=1 ;;
              *) printf '  %-18s %s (hard gate)\n' "$1" "$2"; hard_gate_failed=1 ;;
            esac
          }
          check_hard derive_scope "${SCOPE_DERIVATION_OUTCOME}"
          check_hard validate_json "${JSON_VALIDATION_OUTCOME}"
          check_hard check_compile "${COMPILE_OUTCOME}"

          failed_suites=""
          skipped_suites=""
          for suite in core_types knowledge inference canonical_paths; do
            var="$(printf '%s_OUTCOME' "${suite}" | tr '[:lower:]' '[:upper:]')"
            outcome="${!var}"
            printf '  %-18s %s\n' "${suite}" "${outcome}"
            case "${outcome}" in
              success) ;;
              "") echo "  ${suite}: MISSING (no result)"; invalid=1 ;;
              *) failed_suites="${failed_suites} ${suite}" ;;
            esac
          done

          if [ "${hard_gate_failed}" -eq 1 ]; then
            echo "::error::Aggregate verdict: FAIL — a hard gate did not succeed, so the suites did not all execute."
          fi
          if [ -n "${failed_suites}" ]; then
            echo "::error::Aggregate verdict: FAIL — failing suites:${failed_suites}"
          fi
          if [ -n "${skipped_suites}" ] && [ "${hard_gate_failed}" -eq 0 ]; then
            echo "::warning::Aggregate verdict: suites skipped without a broken hard gate:${skipped_suites}"
          fi

          if [ "${invalid}" -eq 1 ]; then
            echo "::error::Aggregate verdict: INVALID — a required result is missing. This is a configuration fault, not a test failure."
            echo "Aggregate verdict: INVALID"
            exit 2
          fi
          if [ "${hard_gate_failed}" -eq 1 ] || [ -n "${failed_suites}" ]; then
            echo "Aggregate verdict: FAIL"
            verdict="FAIL"
          else
            echo "Aggregate verdict: PASS — every executed test suite succeeded."
            verdict="PASS"
          fi

          printf '{"gate":"layer-0-4","verdict":"%s","sha":"%s","run_id":"%s","ts":"%s","gates":{"validate_json":"%s","check_compile":"%s","core_types":"%s","knowledge":"%s","inference":"%s","canonical_paths":"%s"}}\n' \
            "${verdict}" "${GITHUB_SHA:-unknown}" "${GITHUB_RUN_ID:-local}" "$(date -u +%FT%TZ)" \
            "${JSON_VALIDATION_OUTCOME}" "${COMPILE_OUTCOME}" "${CORE_TYPES_OUTCOME}" \
            "${KNOWLEDGE_OUTCOME}" "${INFERENCE_OUTCOME}" "${CANONICAL_PATHS_OUTCOME}" \
            > gate-receipt.json
          cat gate-receipt.json

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## F-gate receipt"
              echo '```json'
              cat gate-receipt.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

          if [ "${verdict}" = "FAIL" ]; then
            exit 1
          fi

      # The gate receipt is written into the workspace: it is the durable
      # evidence. Artifact upload is skipped on purpose: Forgejo 11.0.1 does
      # not support upload-artifact@v4, and a red step that nobody reads is
      # noise, not proof.

      - name: Echo Gate Receipt (fallback)
        if: always()
        run: |
          if [ -f gate-receipt.json ]; then
            echo "GATE_RECEIPT_BEGIN"
            cat gate-receipt.json
            echo "GATE_RECEIPT_END"
          else
            echo "gate-receipt.json missing"
          fi
