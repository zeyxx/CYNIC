[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-lifecycle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Deterministic runtime lifecycle, blue-green deployment, binary reconciliation and repair"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
cynic-process = { path = "../cynic-process" }
cynic-types = { path = "../cynic-types" }
cynic-storage = { path = "../cynic-storage" }
cynic-build = { path = "../cynic-build" }
cynic-release = { path = "../cynic-release" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = "3"
