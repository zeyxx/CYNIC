[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-release"
version.workspace = true
edition.workspace = true
authors = ["CYNIC Sovereign Collective"]
description = "Pure decision engine for release validation, semver qualification, and public relay projection eligibility"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
hex.workspace = true
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
thiserror = "2.0"
walkdir.workspace = true

[dev-dependencies]
tempfile = "3.17"
