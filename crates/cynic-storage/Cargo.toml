[package]
name = "cynic-storage"
version = "0.1.0"
edition = "2024"
description = "CYNIC Storage — sovereign SMR event-sourced WAL and embedded state projections"

[dependencies]
cynic-protocol = { path = "../cynic-protocol" }
bytes = { version = "1", features = ["serde"] }
hex = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
