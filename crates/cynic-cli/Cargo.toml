[package]
# Artefact discovery is frozen: every binary is declared below.
autobins = false
name = "cynic-cli"
version.workspace = true
edition.workspace = true
publish = false
default-run = "cynic"

[[bin]]
name = "cynic"
path = "src/main.rs"

[features]
# Off by default: the canonical reader binary stays read-only. Enabling this
# compiles the explicit `--apply` SSOT writer for operators who regenerate
# the derived half of the topology document.
default = []
topology_write = []

[dependencies]
cynic-agent = { path = "../cynic-agent" }
clap = { version = "4", features = ["derive", "env"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
cynic-consensus = { path = "../cynic-consensus" }
cynic-types = { path = "../cynic-types" }
cynic-host = { path = "../cynic-host" }
cynic-kernel = { path = "../cynic-kernel" }
# The audit engine, extracted from cynic-host. `cynic audit` calls it directly.
cynic-audit-engine = { path = "../cynic-audit-engine" }
cynic-inference = { path = "../cynic-inference" }
# Hub provider contract, consumed directly (never via inference re-exports).
cynic-node = { path = "../cynic-node" }
cynic-tui = { path = "../cynic-tui" }
cynic-supervisor = { path = "../cynic-supervisor" }
cynic-protocol = { path = "../cynic-protocol" }
cynic-ssh = { path = "../cynic-ssh" }
cynic-proxmox = { path = "../cynic-proxmox" }
cynic-node-protocol = { path = "../cynic-node-protocol" }
cynic-persistence = { path = "../cynic-persistence" }
cynic-vcs = { path = "../cynic-vcs" }
cynic-build = { path = "../cynic-build" }
cynic-process = { path = "../cynic-process" }
cynic-network = { path = "../cynic-network" }
cynic-forensics = { path = "../cynic-forensics" }
cynic-release = { path = "../cynic-release" }
cynic-pkg = { path = "../cynic-pkg" }
cynic-eval = { path = "../cynic-eval" }
cynic-domain-ops = { path = "../cynic-domain-ops" }
cynic-secrets = { path = "../cynic-secrets" }
cynic-intel = { path = "../cynic-intel" }
cynic-discovery = { path = "../cynic-discovery" }
cynic-traces = { path = "../cynic-traces" }
cynic-sandbox = { path = "../cynic-sandbox" }
cynic-knowledge = { path = "../cynic-knowledge" }
tokio = { version = "1", features = ["full"] }
chrono.workspace = true
walkdir.workspace = true
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
# node_activation_surface hashes an identity public key for its report digest.
# Versions match cynic-node / cynic-protocol so the CLI does not pull a second
# copy of sha2 into the graph.
sha2.workspace = true
hex.workspace = true
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
cynic-types = { path = "../cynic-types" }
serde_json = "1"
tempfile = "3"

[build-dependencies]
rustix = { version = "1", features = ["fs"] }
serde_json = "1"

[lints]
workspace = true
